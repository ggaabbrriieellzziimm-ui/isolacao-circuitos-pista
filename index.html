<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Isolação de Balizamento">
<title>Isolação de Balizamento</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link href="https://cdnjs.cloudflare.com/ajax/libs/oswald/5.0.0/oswald.min.css" rel="stylesheet">
<style>
@font-face{
  font-family:'JetBrains Mono';
  src:url('https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/webfonts/rescan/JetBrainsMono-Regular.woff2') format('woff2');
  font-weight:400; font-display:swap;
}
@font-face{
  font-family:'JetBrains Mono';
  src:url('https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/webfonts/rescan/JetBrainsMono-Bold.woff2') format('woff2');
  font-weight:700; font-display:swap;
}
:root{
  --bg:#0A0E12;
  --panel:#121920;
  --panel2:#161F27;
  --border:#232E38;
  --amber:#FFB020;
  --amber-dim:#8A5F16;
  --green:#34D399;
  --green-dim:#0F3D2E;
  --red:#F0453A;
  --red-dim:#4A1512;
  --text:#EAF0F6;
  --muted:#7E8FA0;
  --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --disp:'Oswald', 'Arial Narrow', sans-serif;
  --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  min-height:100vh; overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom);}
::selection{background:var(--amber);color:#000;}

/* ---- runway edge-light rule, the signature motif ---- */
.edgelights{height:6px;display:flex;gap:3px;padding:0 10px;background:var(--bg);}
.edgelights span{flex:1;height:6px;background:var(--amber-dim);border-radius:1px;}
.edgelights span.on{background:var(--amber); box-shadow:0 0 6px var(--amber);}

header.app{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:calc(env(safe-area-inset-top) + 14px);}
.app-title{padding:0 18px 12px;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--amber);text-transform:uppercase;}
.h1{font-family:var(--disp);font-weight:600;font-size:28px;letter-spacing:.01em;line-height:1.05;margin-top:4px;
  text-transform:uppercase;}
.h1 small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--muted);
  text-transform:none;letter-spacing:0;margin-top:3px;}

/* tabs */
.tabs{display:flex;margin:14px 18px 0;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;}
.tab{flex:1;text-align:center;padding:10px 6px;border-radius:8px;font-family:var(--disp);font-weight:500;
  font-size:15px;letter-spacing:.03em;color:var(--muted);cursor:pointer;user-select:none;text-transform:uppercase;}
.tab.active{background:var(--amber);color:#1a1200;}

.search{margin:12px 18px 6px;position:relative;}
.search input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px 11px 36px;color:var(--text);font-size:15px;font-family:var(--sans);}
.search input::placeholder{color:var(--muted);}
.search::before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;}

main{padding:6px 18px 40px;max-width:640px;margin:0 auto;}

/* circuit list cards */
.clist{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.ccard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.ccard:active{background:var(--panel2);}
.ccard .left{display:flex;flex-direction:column;gap:3px;}
.ctag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;}
.cname{font-family:var(--disp);font-size:19px;font-weight:500;letter-spacing:.01em;}
.cmeta{font-family:var(--mono);font-size:12px;color:var(--muted);}
.cstatus{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-left:10px;}
.cstatus.ok{background:var(--green);box-shadow:0 0 6px var(--green);}
.cstatus.alert{background:var(--red);box-shadow:0 0 6px var(--red);}
.cstatus.none{background:var(--border);}
.ccard.nodata{opacity:.5;}
.nodata-tag{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--border);border-radius:5px;padding:2px 6px;margin-left:8px;white-space:nowrap;}
.chev{color:var(--muted);font-size:20px;margin-left:8px;}
.crow{display:flex;align-items:center;}
.side-divider{margin:18px 18px 8px;font-family:var(--disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);
  display:flex;align-items:center;gap:8px;}
.side-divider::after{content:'';flex:1;height:1px;background:var(--border);}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}

/* detail view */
.detail{display:none;}
.detail.show{display:block;}
.clist-wrap.hide{display:none;}
.backbar{display:flex;align-items:center;gap:8px;margin:6px 16px 12px;padding:9px 14px;cursor:pointer;
  color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:10px;width:fit-content;
  font-family:var(--disp);font-size:13px;letter-spacing:.02em;}
.backbar:active{background:var(--panel2);}
.backbar svg{width:18px;height:18px;stroke:var(--amber);}
.backbar svg{width:18px;height:18px;}
.backbar span{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;}

.dheader{margin-bottom:14px;}
.dtag{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.1em;text-transform:uppercase;}
.dname{font-family:var(--disp);font-size:26px;font-weight:600;text-transform:uppercase;margin-top:2px;}
.dmeta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px;}

/* runway strip visual */
.strip-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 14px;margin-bottom:14px;}
.strip-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.strip{position:relative;height:34px;background:linear-gradient(180deg,#1b232c,#141b22);border-radius:6px;
  display:flex;align-items:center;padding:0 8px;overflow:hidden;}
.strip .fill{position:absolute;top:0;bottom:0;background:rgba(255,176,32,.18);border-left:2px solid var(--amber);
  border-right:2px solid var(--amber);transition:left .2s,width .2s;}
.strip .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--border);top:50%;
  transform:translate(-50%,-50%);z-index:2;}
.strip .dot.active{background:var(--amber);box-shadow:0 0 5px var(--amber);}

/* form panel */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:6px;}
.field input, .field select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:12px 12px;color:var(--text);font-size:16px;font-family:var(--mono);}
.field input:focus, .field select:focus{outline:none;border-color:var(--amber);}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}

.seg-toggle{display:flex;gap:8px;}
.seg-btn{flex:1;padding:11px;text-align:center;border:1px solid var(--border);border-radius:8px;
  font-family:var(--disp);font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);
  background:var(--panel2);cursor:pointer;}
.seg-btn.active[data-t="prev"]{background:var(--green-dim);border-color:var(--green);color:var(--green);}
.seg-btn.active[data-t="corr"]{background:var(--red-dim);border-color:var(--red);color:#ff8a82;}

/* readout */
.readout{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 16px;margin-bottom:14px;}
.ro-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.ro-item .k{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.ro-item .v{font-family:var(--mono);font-size:16px;margin-top:3px;}
.big{border-top:1px solid var(--border);padding-top:14px;text-align:center;}
.big .k{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.big .v{font-family:var(--disp);font-size:40px;font-weight:600;margin-top:4px;color:var(--amber);}
.big .unit{font-size:18px;color:var(--muted);font-weight:400;}

.status-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:20px;
  font-family:var(--disp);font-size:14px;letter-spacing:.03em;text-transform:uppercase;margin-top:10px;}
.status-pill.ok{background:var(--green-dim);color:var(--green);}
.status-pill.alert{background:var(--red-dim);color:#ff8a82;}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}

button.primary{width:100%;padding:15px;background:var(--amber);color:#1a1200;border:none;border-radius:10px;
  font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  cursor:pointer;margin-top:2px;}
button.primary:active{background:#e0a01c;}
button.secondary{width:100%;padding:13px;background:transparent;color:var(--text);border:1px solid var(--border);
  border-radius:10px;font-family:var(--disp);font-size:14px;letter-spacing:.03em;text-transform:uppercase;
  cursor:pointer;margin-top:8px;}

/* history */
.hist-section{margin-top:22px;}
.hist-title{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.hist-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;}
.hist-item .l{font-family:var(--mono);font-size:13px;}
.hist-item .l .rng{color:var(--text);}
.hist-item .l .meta{color:var(--muted);font-size:11px;margin-top:3px;}
.hist-badge{font-family:var(--disp);font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;
  border-radius:12px;}
.hist-badge.ok{background:var(--green-dim);color:var(--green);}
.hist-badge.alert{background:var(--red-dim);color:#ff8a82;}
.hist-empty{color:var(--muted);font-size:13px;text-align:center;padding:16px;}
.hist-del{background:none;border:none;color:var(--muted);font-size:18px;padding:4px 8px;cursor:pointer;}
.hist-trend{background:var(--panel2);border:1px solid var(--border);border-radius:8px;font-size:15px;
  padding:5px 9px;cursor:pointer;}

.foto-preview{width:100%;border-radius:10px;margin-bottom:8px;display:block;max-height:220px;object-fit:cover;
  border:1px solid var(--border);}
.foto-remove{background:var(--red-dim);color:#ff8a82;border:none;border-radius:8px;padding:8px;width:100%;
  font-family:var(--disp);font-size:12px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;margin-bottom:8px;}
.geo-status{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;
  display:flex;align-items:center;gap:6px;}
.geo-status.ok{color:var(--green);}
.geo-status.err{color:var(--muted);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--amber);color:var(--text);padding:12px 20px;border-radius:10px;font-size:14px;
  font-family:var(--sans);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  box-shadow:0 8px 30px rgba(0,0,0,.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.err-panel{position:fixed;left:14px;right:14px;bottom:24px;z-index:200;background:#2A1113;
  border:2px solid var(--red);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.6);
  max-height:60vh;overflow-y:auto;}
.err-panel-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  border-bottom:1px solid rgba(240,69,58,.3);font-family:var(--disp);font-size:13px;letter-spacing:.05em;
  color:#ff8a82;text-transform:uppercase;}
.err-panel-header button{background:none;border:none;color:#ff8a82;font-size:18px;padding:2px 8px;cursor:pointer;}
.err-panel-body{padding:14px;font-family:var(--mono);font-size:12px;line-height:1.6;color:#ffd1cf;
  white-space:pre-wrap;word-break:break-word;user-select:text;}

.export-bar{margin-top:20px;}

.warn-banner{background:var(--red-dim);border:1px solid var(--red);border-radius:10px;padding:12px 14px;
  margin-bottom:14px;font-size:13px;line-height:1.5;color:#ffb3ae;}
.warn-banner b{color:#fff;}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px;}

.free-search{background:var(--panel);border:1px dashed var(--amber-dim);border-radius:12px;padding:16px;margin-bottom:14px;}
.free-search .fs-title{font-family:var(--disp);font-size:15px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.free-search .fs-sub{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5;}
.fs-tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:10px;margin-top:8px;}
.fs-tag.estimado{background:var(--amber-dim);color:var(--amber);}
.fs-tag.oficial{background:var(--green-dim);color:var(--green);}
.fs-result{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
.fs-result .v{font-family:var(--disp);font-size:28px;font-weight:600;color:var(--amber);}
.fs-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}

/* alternador preventiva/corretiva */
.mode-toggle{display:flex;gap:8px;margin:10px 18px 0;}
.mode-btn{flex:1;padding:10px;text-align:center;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;font-family:var(--disp);font-size:12px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;}
.mode-btn.active{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:600;}
.mode-btn.active[data-m="corr"]{background:#e5484d;color:#fff;border-color:#e5484d;}

.os-panel{margin:0 16px 14px;padding:12px 14px;background:var(--panel);border:1.5px solid #e5484d;border-radius:12px;}
.os-panel.corr{border-color:#e5484d;}
.os-panel label{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
.os-panel.corr label{color:#ff8a82;}
.os-panel input{width:100%;padding:10px;border-radius:8px;border:1px solid #e5484d;background:var(--bg);color:var(--text);font-size:16px;}
.os-hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4;}
.os-suggest{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.os-suggest-chip{padding:6px 12px;border-radius:999px;border:1px solid var(--amber);background:transparent;
  color:var(--amber);font-family:var(--disp);font-size:13px;cursor:pointer;}
.os-suggest-chip.corr{border-color:#e5484d;color:#ff8a82;}
.os-suggest-chip:active{background:rgba(255,255,255,.08);}
.next-suggest-btn{width:100%;margin-top:10px;padding:10px;background:var(--panel2);border:1px dashed var(--amber);
  border-radius:9px;color:var(--amber);font-family:var(--disp);font-size:13px;cursor:pointer;}

.corr-item{margin:0 16px 12px;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
.corr-rank{font-family:var(--disp);font-size:15px;color:#e5484d;font-weight:700;min-width:28px;}
.corr-info{flex:1;min-width:180px;}
.corr-range{font-family:var(--disp);font-size:14px;color:var(--text);}
.corr-meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
.corr-form{display:flex;gap:8px;width:100%;margin-top:8px;}
.corr-medida-input{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;}
.corr-save-btn{padding:9px 14px;border-radius:8px;border:none;background:#e5484d;color:#fff;font-family:var(--disp);font-size:12px;text-transform:uppercase;cursor:pointer;}

/* painel geral */
.panel-geral-btn{width:100%;margin-top:10px;padding:11px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-family:var(--disp);font-size:13px;letter-spacing:.03em;
  text-transform:uppercase;cursor:pointer;}

/* backup discreto */
.backup-row{display:flex;gap:8px;margin-top:8px;}
.backup-btn{flex:1;padding:8px;background:transparent;border:1px solid var(--border);
  border-radius:9px;color:var(--muted);font-family:var(--disp);font-size:10.5px;letter-spacing:.03em;
  text-transform:uppercase;cursor:pointer;}
.backup-btn:active{background:var(--panel);}
.painel-geral{display:none;}
.painel-geral.show{display:block;}
.pg-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.pg-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.pg-card .k{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.pg-card .v{font-family:var(--disp);font-size:34px;font-weight:600;margin-top:6px;}
.pg-card.alert .v{color:var(--red);}
.pg-card.ok .v{color:var(--green);}
.pg-section-title{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;margin:18px 0 10px;}
.pg-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.pg-item:active{background:var(--panel2);}
.pg-item.readonly{cursor:default;}
.pg-item.readonly:active{background:var(--panel);}
.pg-item.dim{opacity:.55;}
.pg-ok-tag{font-family:var(--disp);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--green);
  background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);border-radius:8px;padding:5px 9px;}
.pg-trend-btn{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  width:38px;height:38px;min-width:38px;flex-shrink:0;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;}
.pg-item .l{font-family:var(--disp);font-size:15px;}
.pg-item .m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;}
.pg-item .count{font-family:var(--disp);font-size:20px;font-weight:600;color:var(--red);}
.pg-empty{text-align:center;color:var(--green);padding:24px;font-family:var(--disp);font-size:14px;}

/* painel de tendencia */
.trend-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;
  align-items:flex-end;justify-content:center;}
.trend-overlay.show{display:flex;}
.trend-panel{background:var(--panel);border-top:1px solid var(--border);border-radius:18px 18px 0 0;
  width:100%;max-width:640px;max-height:85vh;overflow-y:auto;padding:18px;}
.trend-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.trend-title{font-family:var(--disp);font-size:18px;}
.trend-close{background:none;border:none;color:var(--muted);font-size:22px;padding:4px 8px;cursor:pointer;}
.trend-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px;}
.trend-chart-wrap{background:var(--panel2);border-radius:10px;padding:10px;margin-bottom:14px;}
.trend-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:12px;}
.trend-row:last-child{border-bottom:none;}
.trend-row .badge{padding:2px 8px;border-radius:10px;font-family:var(--disp);font-size:10px;text-transform:uppercase;}
.trend-row .badge.ok{background:var(--green-dim);color:var(--green);}

<script>
// ---------------------------------------------------------------
// ---------------------------------------------------------------
// GERADOR DE .XLSX EMBUTIDO — escreve o arquivo Excel (ZIP + XML)
// inteiramente no navegador, sem depender de nenhuma biblioteca
// externa/CDN. Funciona 100% offline, sempre.
// ---------------------------------------------------------------
// ------------------------------------------------------------------
// Escritor de ZIP mínimo, sem dependências externas (método STORED,
// sem compressão — arquivos são XML pequenos, então o tamanho extra
// não importa). Funciona igual em Node e no navegador (usa apenas
// TextEncoder/Uint8Array/DataView, sem Buffer).
// ------------------------------------------------------------------

// Tabela de CRC32 (algoritmo padrão)
const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function strToBytes(str) {
  return new TextEncoder().encode(str);
}

// DOS date/time (fixo, não importa para abrir o arquivo)
const DOS_TIME = 0;
const DOS_DATE = 0x21; // 1/1/1980

// files: array de {name: string, data: Uint8Array}
function buildZip(files) {
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(f => {
    const nameBytes = strToBytes(f.name);
    const data = f.data;
    const crc = crc32(data);
    const size = data.length;

    // Local File Header
    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);   // signature
    lv.setUint16(4, 20, true);           // version needed
    lv.setUint16(6, 0, true);            // flags
    lv.setUint16(8, 0, true);            // method = stored
    lv.setUint16(10, DOS_TIME, true);
    lv.setUint16(12, DOS_DATE, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);        // compressed size
    lv.setUint32(22, size, true);        // uncompressed size
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);           // extra len
    local.set(nameBytes, 30);

    localParts.push(local, data);

    // Central Directory Header
    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);           // version made by
    cv.setUint16(6, 20, true);           // version needed
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, DOS_TIME, true);
    cv.setUint16(14, DOS_DATE, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);           // extra len
    cv.setUint16(32, 0, true);           // comment len
    cv.setUint16(34, 0, true);           // disk number
    cv.setUint16(36, 0, true);           // internal attrs
    cv.setUint32(38, 0, true);           // external attrs
    cv.setUint32(42, offset, true);      // offset of local header
    central.set(nameBytes, 46);
    centralParts.push(central);

    offset += local.length + data.length;
  });

  const centralStart = offset;
  let centralSize = 0;
  centralParts.forEach(p => centralSize += p.length);

  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralStart, true);
  ev.setUint16(20, 0, true);

  const allParts = [...localParts, ...centralParts, end];
  let totalLen = 0;
  allParts.forEach(p => totalLen += p.length);
  const out = new Uint8Array(totalLen);
  let pos = 0;
  allParts.forEach(p => { out.set(p, pos); pos += p.length; });
  return out;
}


function xmlEscape(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function colLetter(n) {
  // n is 1-based
  let s = '';
  while (n > 0) {
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

// ------------------------------------------------------------------
// Construtor de planilha .xlsx simples com estilos (fills, fonts,
// borders, merges, autofilter, fórmulas com valor em cache).
// ------------------------------------------------------------------
class SimpleXlsx {
  constructor(sheetName) {
    this.sheetName = sheetName;
    this.rows = {}; // rowNum -> { colNum -> cell }
    this.merges = [];
    this.colWidths = [];
    this.autoFilterRange = null;
    this.rowHeights = {};
    // paleta de estilos: cada estilo único vira um índice em cellXfs
    this.fonts = [{ bold: false, color: null, size: 11 }]; // idx0 default
    this.fills = [{ type: 'none' }, { type: 'gray125' }]; // idx0/1 reservados pelo padrão OOXML
    this.borders = [{ none: true }]; // idx0 default
    this.numFmts = []; // {id, code}
    this.cellXfs = [{ fontId: 0, fillId: 0, borderId: 0, numFmtId: 0, align: null }]; // idx0 default
    this._styleCache = new Map();
  }

  _cell(row, col) {
    if (!this.rows[row]) this.rows[row] = {};
    if (!this.rows[row][col]) this.rows[row][col] = {};
    return this.rows[row][col];
  }

  setColWidths(widths) { this.colWidths = widths; }
  setRowHeight(row, h) { this.rowHeights[row] = h; }
  mergeCells(range) { this.merges.push(range); }
  setAutoFilter(range) { this.autoFilterRange = range; }

  _styleIndex(style) {
    const key = JSON.stringify(style || {});
    if (this._styleCache.has(key)) return this._styleCache.get(key);

    let fontId = 0;
    if (style && (style.bold || style.color || style.size)) {
      fontId = this.fonts.length;
      this.fonts.push({ bold: !!style.bold, color: style.color || null, size: style.size || 11 });
    }
    let fillId = 0;
    if (style && style.fill) {
      fillId = this.fills.length;
      this.fills.push({ type: 'solid', color: style.fill });
    }
    let borderId = 0;
    if (style && style.border) {
      borderId = this.borders.length;
      this.borders.push({ all: true, color: style.borderColor || '808080' });
    }
    let numFmtId = 0;
    if (style && style.numFmt) {
      numFmtId = 164 + this.numFmts.length; // ids customizados começam em 164
      this.numFmts.push({ id: numFmtId, code: style.numFmt });
    }
    const idx = this.cellXfs.length;
    this.cellXfs.push({ fontId, fillId, borderId, numFmtId, align: style && style.align });
    this._styleCache.set(key, idx);
    return idx;
  }

  setCell(row, col, value, style) {
    const c = this._cell(row, col);
    c.value = value;
    c.styleIdx = this._styleIndex(style);
  }

  setFormula(row, col, formula, cachedResult, style) {
    const c = this._cell(row, col);
    c.formula = formula;
    c.value = cachedResult;
    c.styleIdx = this._styleIndex(style);
  }

  _cellXml(row, col, cell) {
    const ref = colLetter(col) + row;
    const s = cell.styleIdx ? ` s="${cell.styleIdx}"` : '';
    if (cell.formula !== undefined) {
      const cached = cell.value;
      let cachedXml = '';
      if (typeof cached === 'number') {
        cachedXml = `<v>${cached}</v>`;
      } else if (typeof cached === 'string' && cached !== '') {
        cachedXml = ` t="str"><f>${xmlEscape(cell.formula)}</f><v>${xmlEscape(cached)}`;
        return `<c r="${ref}"${s}${cachedXml}</v></c>`;
      }
      return `<c r="${ref}"${s}><f>${xmlEscape(cell.formula)}</f>${cachedXml}</c>`;
    }
    const v = cell.value;
    if (v === undefined || v === null || v === '') {
      return `<c r="${ref}"${s}/>`;
    }
    if (typeof v === 'number') {
      return `<c r="${ref}"${s}><v>${v}</v></c>`;
    }
    // string inline
    return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEscape(v)}</t></is></c>`;
  }

  _sheetDataXml() {
    const rowNums = Object.keys(this.rows).map(Number).sort((a, b) => a - b);
    let xml = '';
    rowNums.forEach(rn => {
      const h = this.rowHeights[rn] ? ` ht="${this.rowHeights[rn]}" customHeight="1"` : '';
      xml += `<row r="${rn}"${h}>`;
      const cols = Object.keys(this.rows[rn]).map(Number).sort((a, b) => a - b);
      cols.forEach(cn => {
        xml += this._cellXml(rn, cn, this.rows[rn][cn]);
      });
      xml += `</row>`;
    });
    return xml;
  }

  _colsXml() {
    if (!this.colWidths.length) return '';
    let xml = '<cols>';
    this.colWidths.forEach((w, i) => {
      xml += `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`;
    });
    xml += '</cols>';
    return xml;
  }

  _mergeXml() {
    if (!this.merges.length) return '';
    return `<mergeCells count="${this.merges.length}">` +
      this.merges.map(m => `<mergeCell ref="${m}"/>`).join('') +
      `</mergeCells>`;
  }

  _autoFilterXml() {
    if (!this.autoFilterRange) return '';
    return `<autoFilter ref="${this.autoFilterRange}"/>`;
  }

  _stylesXml() {
    let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    xml += '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';

    if (this.numFmts.length) {
      xml += `<numFmts count="${this.numFmts.length}">`;
      this.numFmts.forEach(nf => {
        xml += `<numFmt numFmtId="${nf.id}" formatCode="${xmlEscape(nf.code)}"/>`;
      });
      xml += `</numFmts>`;
    }

    xml += `<fonts count="${this.fonts.length}">`;
    this.fonts.forEach(f => {
      xml += '<font>';
      if (f.bold) xml += '<b/>';
      xml += `<sz val="${f.size}"/>`;
      if (f.color) xml += `<color rgb="${f.color}"/>`;
      xml += '<name val="Calibri"/>';
      xml += '</font>';
    });
    xml += '</fonts>';

    xml += `<fills count="${this.fills.length}">`;
    this.fills.forEach(f => {
      if (f.type === 'none') { xml += '<fill><patternFill patternType="none"/></fill>'; }
      else if (f.type === 'gray125') { xml += '<fill><patternFill patternType="gray125"/></fill>'; }
      else { xml += `<fill><patternFill patternType="solid"><fgColor rgb="${f.color}"/><bgColor indexed="64"/></patternFill></fill>`; }
    });
    xml += '</fills>';

    xml += `<borders count="${this.borders.length}">`;
    this.borders.forEach(b => {
      if (b.none) { xml += '<border><left/><right/><top/><bottom/><diagonal/></border>'; }
      else {
        const c = `<color rgb="FF${b.color}"/>`;
        xml += `<border>` +
          `<left style="thin">${c}</left>` +
          `<right style="thin">${c}</right>` +
          `<top style="thin">${c}</top>` +
          `<bottom style="thin">${c}</bottom>` +
          `<diagonal/></border>`;
      }
    });
    xml += '</borders>';

    xml += `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`;

    xml += `<cellXfs count="${this.cellXfs.length}">`;
    this.cellXfs.forEach(xf => {
      const align = xf.align ? `<alignment horizontal="${xf.align.h||'left'}" vertical="${xf.align.v||'center'}" wrapText="${xf.align.wrap?1:0}"/>` : '';
      xml += `<xf numFmtId="${xf.numFmtId}" fontId="${xf.fontId}" fillId="${xf.fillId}" borderId="${xf.borderId}" xfId="0"` +
        (xf.numFmtId ? ' applyNumberFormat="1"' : '') +
        (xf.fontId ? ' applyFont="1"' : '') +
        (xf.fillId ? ' applyFill="1"' : '') +
        (xf.borderId ? ' applyBorder="1"' : '') +
        (align ? ' applyAlignment="1"' : '') +
        `>${align}</xf>`;
    });
    xml += '</cellXfs>';
    xml += `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>`;
    xml += '</styleSheet>';
    return xml;
  }

  _sheetXml() {
    const rowNums = Object.keys(this.rows).map(Number);
    const maxRow = rowNums.length ? Math.max(...rowNums) : 1;
    const maxCol = Math.max(1, ...Object.values(this.rows).flatMap(r => Object.keys(r).map(Number)));
    let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    xml += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    xml += `<dimension ref="A1:${colLetter(maxCol)}${maxRow}"/>`;
    xml += `<sheetViews><sheetView workbookViewId="0"><pane ySplit="2" topLeftCell="A3" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`;
    xml += this._colsXml();
    xml += `<sheetData>${this._sheetDataXml()}</sheetData>`;
    xml += this._autoFilterXml();
    xml += this._mergeXml();
    xml += '</worksheet>';
    return xml;
  }

  toBytes() {
    const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>';

    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';

    const workbookXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      `<sheets><sheet name="${xmlEscape(this.sheetName)}" sheetId="1" r:id="rId1"/></sheets>` +
      '</workbook>';

    const workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';

    const files = [
      { name: '[Content_Types].xml', data: strToBytes(contentTypes) },
      { name: '_rels/.rels', data: strToBytes(rootRels) },
      { name: 'xl/workbook.xml', data: strToBytes(workbookXml) },
      { name: 'xl/_rels/workbook.xml.rels', data: strToBytes(workbookRels) },
      { name: 'xl/styles.xml', data: strToBytes(this._stylesXml()) },
      { name: 'xl/worksheets/sheet1.xml', data: strToBytes(this._sheetXml()) },
    ];
    return buildZip(files);
  }
}



// STATE
// ---------------------------------------------------------------
let currentPista = Object.keys(CIRCUIT_DATA)[0];
let appMode = 'prev'; // 'prev' | 'corr' — menu ativo no momento
let currentCircuit = null; // circuit object when in detail view
const STORAGE_KEY = 'rgl_isolacao_registros_v1';
const OS_MAP_KEY = 'rgl_isolacao_os_map_v1'; // {circId: última OS usada} — lembrete na tela, não pré-preenche.
function loadOsMap(){
  try{ return JSON.parse(localStorage.getItem(OS_MAP_KEY)) || {}; }catch(e){ return {}; }
}
function saveLastOsForCircuit(circId, os){
  const m = loadOsMap();
  m[circId] = os;
  localStorage.setItem(OS_MAP_KEY, JSON.stringify(m));
}
// Últimas OS usadas nesse circuito (só as 2 mais recentes), pra sugerir como
// chips clicáveis em vez do técnico ter que redigitar/olhar de novo.
function recentOsFor(circId, manutFilter){
  const recs = loadRecords().filter(r=>r.circId===circId && r.manut===manutFilter && r.os);
  const lastTsByOs = {};
  recs.forEach(r=>{ if(!lastTsByOs[r.os] || r.ts>lastTsByOs[r.os]) lastTsByOs[r.os]=r.ts; });
  return Object.entries(lastTsByOs).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
}

function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ return []; }
}
function saveRecords(recs){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(recs));
}

// Seed localStorage with any imported field-measurement history bundled in the
// data file (from spreadsheets already digitized), once per circuit, so it
// shows up as pre-existing "Registros salvos" the first time the app is opened.
// ---------------------------------------------------------------

function seedImportedHistory(){
  const SEED_FLAG_KEY = 'rgl_isolacao_seeded_v1';
  let seeded;
  try{ seeded = JSON.parse(localStorage.getItem(SEED_FLAG_KEY)) || {}; }catch(e){ seeded = {}; }
  let recs = loadRecords();
  let changed = false;
  Object.keys(CIRCUIT_DATA).forEach(pista=>{
    (CIRCUIT_DATA[pista]||[]).forEach(circ=>{
      if(!circ.historico_importado || seeded[circ.id]) return;
      circ.historico_importado.forEach(h=>{
        recs.push({
          id: 'seed_'+circ.id+'_'+h.de+'_'+h.ate,
          circId: circ.id, pista: pista, tipo: circ.tipo, circuito: circ.nome,
          tensao: circ.tensao, de: h.de, ate: h.ate,
          comprimento: h.comprimento, trafos: h.trafos, total_uA: h.total_uA, calculada: h.calculada,
          medida: h.medida, situacao: h.situacao, manut: h.manut,
          ts: h.ts || Date.now(),
        });
      });
      seeded[circ.id] = true;
      changed = true;
    });
  });
  if(changed){
    saveRecords(recs);
    localStorage.setItem(SEED_FLAG_KEY, JSON.stringify(seeded));
  }
}
seedImportedHistory();

// One-time repair for records saved before this fix, where comprimento/trafos/
// total_uA were left empty (this used to break the export button).
function repairLegacyRecords(){
  const REPAIR_FLAG = 'rgl_isolacao_repaired_v1';
  if(localStorage.getItem(REPAIR_FLAG)) return;
  const recs = loadRecords();
  let changed = false;
  recs.forEach(r=>{
    if(r.total_uA!=null && r.comprimento!=null && r.trafos!=null) return;
    const circList = CIRCUIT_DATA[r.pista]||[];
    const circ = circList.find(c=>c.id===r.circId);
    if(!circ) return;
    const i = circ.pontos.findIndex(p=>p.label===r.de);
    let j = -1;
    for(let k=0;k<circ.pontos.length;k++){ if(circ.pontos[k].label===r.ate && k>i){ j=k; break; } }
    if(j===-1) j = circ.pontos.findIndex(p=>p.label===r.ate);
    if(i<0||j<0) return;
    const lo = Math.min(i,j), hi = Math.max(i,j);
    const comprimento = Math.round((circ.pontos[hi].cum_len - circ.pontos[lo].cum_len)*10)/10;
    const trafos = Math.round(circ.pontos[hi].cum_trafos - circ.pontos[lo].cum_trafos);
    const total_uA = Math.round((comprimento/100 + trafos*2)*100)/100;
    r.comprimento = comprimento; r.trafos = trafos; r.total_uA = total_uA;
    changed = true;
  });
  if(changed) saveRecords(recs);
  localStorage.setItem(REPAIR_FLAG, '1');
}
repairLegacyRecords();

// ---------------------------------------------------------------
// BACKUP GERAL (JSON) — exportar / restaurar todos os registros
// ---------------------------------------------------------------
async function exportBackupJSON(){
  try{
    const recs = loadRecords();
    const backup = {
      app: 'Isolação de Balizamento',
      tipo: 'backup_geral',
      versao: 1,
      exportado_em: new Date().toISOString(),
      total_registros: recs.length,
      registros: recs,
    };
    const jsonStr = JSON.stringify(backup, null, 2);
    const blob = new Blob([jsonStr], {type:'application/json'});
    const stamp = new Date().toISOString().slice(0,10);
    const filename = `backup_rgl_isolacao_${stamp}.json`;

    if(navigator.share && navigator.canShare){
      try{
        const file = new File([blob], filename, {type:'application/json'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:'Backup Isolação de Balizamento', text:`Backup geral — ${recs.length} registros`});
          showToast('Backup exportado.');
          return;
        }
      }catch(e){
        if(e && e.name === 'AbortError') return; // usuário cancelou o share
        console.warn('Compartilhar backup falhou, baixando direto:', e);
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup baixado: ' + filename);
  }catch(e){
    console.error('Falha ao exportar backup:', e);
    showErrorPanel('Erro ao exportar backup:', (e && e.stack) || String(e));
  }
}

function restoreBackupJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data) ? data : data.registros;
      if(!Array.isArray(incoming)) throw new Error('Arquivo não contém uma lista de registros válida.');

      const current = loadRecords();
      const byId = {};
      current.forEach(r=>{ byId[r.id] = r; });
      let added = 0, updated = 0;
      incoming.forEach(r=>{
        if(!r || !r.id) return;
        if(byId[r.id]) updated++; else added++;
        byId[r.id] = r;
      });
      const merged = Object.values(byId);
      saveRecords(merged);
      showToast(`Backup restaurado: ${added} novo(s), ${updated} atualizado(s).`);
      if(typeof render === 'function') render();
    }catch(e){
      console.error('Falha ao restaurar backup:', e);
      showErrorPanel('Erro ao restaurar backup:', (e && e.stack) || String(e));
    }
  };
  reader.onerror = () => {
    showErrorPanel('Erro ao ler arquivo de backup:', String(reader.error));
  };
  reader.readAsText(file);
}

// Posição de um registro na sequência física da planilha original (não na
// ordem em que foi salvo/medido em campo). Usada para ordenar histórico e
// exportações sempre igual à planilha, não importa a ordem de digitação.
function recordPosition(circ, r){
  if(r.deIdx!=null) return r.deIdx;
  const i = circ.pontos.findIndex(p=>p.label===r.de);
  return i>=0 ? i : 999999;
}

// Chave de agrupamento "De -> Até" que SEMPRE resolve pela posição real do
// ponto na cadeia (nunca pelo texto bruto), mesmo quando o registro não tem
// deIdx/ateIdx salvos (caso dos importados da planilha original). Sem isso,
// um registro importado e um medido depois pro MESMO trecho ficavam com
// chaves diferentes e nenhum sobrescrevia o outro — duplicando a linha.
function groupKeyFor(circ, r){
  let i = r.deIdx;
  if(i==null) i = circ.pontos.findIndex(p=>p.label===r.de);
  let j = r.ateIdx;
  if(j==null){
    j = -1;
    for(let k=0;k<circ.pontos.length;k++){ if(circ.pontos[k].label===r.ate && k>i){ j=k; break; } }
    if(j===-1) j = circ.pontos.findIndex(p=>p.label===r.ate);
  }
  return i+'|'+j;
}

// Nome de exibição do circuito, sem duplicar o tipo quando o nome já
// vem com ele embutido (ex: nome="CIRC 09 29L", tipo="CIRC" -> não repete).
function circLabel(circ){
  const nomeUpper = circ.nome.toUpperCase();
  if(nomeUpper.startsWith(circ.tipo.toUpperCase()) || nomeUpper.startsWith('CIRCUITO')) return circ.nome;
  return `${circ.tipo} ${circ.nome}`;
}

function circuitStatus(circ){
  // check saved records for this circuit -> alert if any latest record is FALHA
  const vals = Object.values(latestByRangeMap(circ));
  if(vals.length===0) return 'none';
  if(vals.some(r=>r.situacao==='FALHA')) return 'alert';
  return 'ok';
}

// Último registro salvo por trecho (De|Até), independente do tipo de
// manutenção — usado pra saber o estado REAL atual de cada trecho.
function latestByRangeMap(circ){
  const recs = loadRecords().filter(r=>r.circId===circ.id);
  const latestByRange = {};
  recs.forEach(r=>{
    const key = groupKeyFor(circ, r);
    if(!latestByRange[key] || r.ts > latestByRange[key].ts) latestByRange[key]=r;
  });
  return latestByRange;
}

// Trechos atualmente em falha (pra Corretiva) — a medição mais recente de
// cada trecho, seja ela preventiva ou corretiva, é a que vale.
function latestFalhaRecords(circ){
  return Object.values(latestByRangeMap(circ)).filter(r=>r.situacao==='FALHA');
}

// Conta quantos trechos (últimos registros, sem contar duplicata) estão em
// FALHA agora mesmo para um circuito — usado no Painel Geral e na Corretiva.
function countFalhas(circ){
  return latestFalhaRecords(circ).length;
}

let pgMode = 'prev'; // aba ativa dentro do Painel Geral (visão geral | pendências corretivas)
function renderPainelGeral(){
  const el = document.getElementById('painelGeral');

  let totalFalhas = 0, totalOk = 0, totalSemDado = 0;

  pistas.forEach(pista=>{
    let falhasNaPista = 0;
    CIRCUIT_DATA[pista].forEach(circ=>{
      if(circ.sem_dados){ totalSemDado++; todosCircuitos.push({pista, circ, n:0, semDados:true}); return; }
      const n = countFalhas(circ);
      if(n>0){ totalFalhas += n; falhasNaPista += n; } else { totalOk++; }
      todosCircuitos.push({pista, circ, n, semDados:false});
    });
    porPista[pista] = falhasNaPista;
  });

  // Falhas primeiro (mais crítico no topo), depois os normais, em ordem alfabética.
  todosCircuitos.sort((a,b)=> b.n - a.n || circLabel(a.circ).localeCompare(circLabel(b.circ)));

  const cardsPista = pistas.map(p=>{
    const n = porPista[p];

      <div class="k" style="margin-top:4px;text-transform:none;letter-spacing:0;">trecho${n===1?'':'s'} em falha agora</div>
    </div>`;
  }).join('');

  const listaFonte = pgMode==='corr' ? todosCircuitos.filter(x=>x.n>0) : todosCircuitos;

  const listaHtml = listaFonte.length ? listaFonte.map(x=>{
    const osAtual = loadOsMap()[x.circ.id] || null;
    const osCorr = x.n>0 ? [...new Set(latestFalhaRecords(x.circ).map(r=>{
      const corr = loadRecords().filter(c=>c.circId===x.circ.id && c.manut==='corr' && c.deIdx===r.deIdx && c.ateIdx===r.ateIdx).sort((a,b)=>b.ts-a.ts)[0];
      return corr ? corr.os : null;
    }).filter(Boolean))] : [];
    const osTxt = x.n>0
      ? (osCorr.length ? `OS corretiva: ${osCorr.join(', ')}` : 'sem OS corretiva aberta')

    return `
    <div class="pg-item readonly ${x.semDados?'dim':''}">
      <div>
        <div class="l">${circLabel(x.circ)}</div>
        <div class="m">${x.pista}${x.semDados ? ' · sem dados' : ` · ${osTxt}`}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        ${x.n>0 ? `<div style="text-align:right;"><div class="count">${x.n}</div><div class="m" style="margin-top:0;">trecho${x.n===1?'':'s'}</div></div>` : `<div class="pg-ok-tag">${x.semDados?'—':'OK'}</div>`}
        ${!x.semDados ? `<button class="pg-trend-btn" data-pista="${x.pista}" data-circid="${x.circ.id}" title="Ver histórico">📈</button>` : ''}
      </div>
    </div>`;
  }).join('')
    : `<div class="pg-empty">✓ Nenhum trecho em falha em nenhuma pista agora.</div>`;

  el.innerHTML = `
    <div class="backbar" id="pgBackBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Voltar</span>
    </div>
    <div class="dheader">
      <div class="dtag">Visão geral · somente leitura · ${currentPista}</div>
      <div class="dname">SAÚDE DAS PISTAS</div>
      <div class="dmeta">${totalOk} circuitos normais · ${todosCircuitos.filter(x=>x.n>0).length} com alerta · ${totalSemDado} sem dado</div>
    </div>
    <div class="mode-toggle" style="margin:0 18px 14px;">
      <div class="mode-btn ${pgMode==='prev'?'active':''}" id="pgModePrev">Todos os circuitos</div>
      <div class="mode-btn ${pgMode==='corr'?'active':''}" id="pgModeCorr" data-m="corr">Só corretiva</div>

  document.getElementById('pgBackBtn').onclick = ()=>{ history.back(); };
  document.getElementById('pgModePrev').onclick = ()=>{ pgMode='prev'; renderPainelGeral(); };
  document.getElementById('pgModeCorr').onclick = ()=>{ pgMode='corr'; renderPainelGeral(); };

  // cadeia) — só leitura, sem editar nada aqui no Painel Geral.

}

// Detecta a que lado da pista (ex: "11L" ou "29R") um item pertence, pelo
// sufixo do nome. Itens sem sufixo (ex: "CIRCUITO 01") herdam o lado do
// item anterior — normalmente são a base da primeira cabeceira da pista.
function sideLabelFor(nome, sideA, sideB){
  const upper = nome.toUpperCase();
  if(new RegExp('\\b'+sideB+'$').test(upper)) return sideB;
  if(new RegExp('\\b'+sideA+'$').test(upper)) return sideA;
  return null;
}
function appendWithSideDividers(clist, circuits, buildCardFn){
  const [sideA, sideB] = currentPista.split('/');
  let lastSide = null;
  circuits.forEach(c=>{
    const detected = sideLabelFor(c.nome, sideA, sideB);
    const effectiveSide = detected || lastSide || sideA;
    if(effectiveSide !== lastSide){
      const divider = document.createElement('div');
      divider.className = 'side-divider';
      divider.textContent = `Início ${effectiveSide}`;
      clist.appendChild(divider);
      lastSide = effectiveSide;
    }
    clist.appendChild(buildCardFn(c));
  });
}

function renderList(){
  const clist = document.getElementById('clist');
  const emptyMsg = document.getElementById('emptyMsg');
  clist.innerHTML = '';
  const circuits = CIRCUIT_DATA[currentPista]||[];
  if(circuits.length===0){ emptyMsg.style.display='block'; return; }
  emptyMsg.style.display='none';

  if(appMode==='corr'){
    // Mesma ordem/disposição dos circuitos da preventiva — só o conteúdo
    // interno de cada um (ao clicar) é que muda pra mostrar os trechos
    // pendentes, ordenados por criticidade.
    appendWithSideDividers(clist, circuits, c=>{
      const noData = !!c.sem_dados;
      const n = noData ? 0 : countFalhas(c);
      const card = document.createElement('div');
      card.className='ccard' + (noData || n===0 ? ' nodata' : '');
      card.innerHTML = `
        <div class="left">
          <div class="cname">${c.nome}</div>
          <div class="cmeta">${noData ? 'Aguardando planilha' : (n>0 ? `${n} trecho${n===1?'':'s'} pendente${n===1?'':'s'} de corretiva` : 'Sem pendências')}</div>
        </div>
        <div class="crow">
          ${n>0 ? `<div class="cstatus alert"></div><div class="chev">›</div>` : `<div class="nodata-tag">${noData?'sem dados':'ok'}</div>`}
        </div>`;
      if(!noData && n>0){ card.onclick = ()=>openCorretivaDetail(c); }
      return card;
    });
    return;
  }

  appendWithSideDividers(clist, circuits, c=>{
    const card = document.createElement('div');
    const noData = !!c.sem_dados;
    card.className='ccard' + (noData ? ' nodata' : '');
    const st = circuitStatus(c);
    card.innerHTML = noData ? `
      <div class="left">
        <div class="cname">${c.nome}</div>
        <div class="cmeta">Aguardando planilha</div>
      </div>
      <div class="crow">
        <div class="nodata-tag">sem dados</div>
      </div>` : `
      <div class="left">
        <div class="cname">${c.nome}</div>
        <div class="cmeta">${c.tensao} V · ${c.pontos.length-1} trechos base · ${c.resumo.trafos_total||'—'} trafos</div>
      </div>
      <div class="crow">
        <div class="cstatus ${st}"></div>
        <div class="chev">›</div>
      </div>`;
    if(!noData){ card.onclick = ()=>openDetail(c); }
    else{ card.onclick = ()=>showToast('Ainda não recebi a planilha desse circuito.'); }
    return card;
  });
}

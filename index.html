function renderCorretivaDetail(){
  const circ = currentCircuit;
  const detail = document.getElementById('detail');
  const pendentes = latestFalhaRecords(circ).map(r=>{
    const deficit = r.calculada>0 ? (1 - r.medida/r.calculada) : 0;
    return {r, deficit};
  }).sort((a,b)=>b.deficit-a.deficit); // pior primeiro

  const osOrigens = [...new Set(pendentes.map(x=>x.r.os).filter(Boolean))];
  const osOrigemTxt = osOrigens.length ? `OS Preventiva de origem: ${osOrigens.join(', ')}` : 'OS Preventiva de origem: —';
  const recentOsListCorr = recentOsFor(circ.id, 'corr');

  const rowsHtml = pendentes.map((x,idx)=>{
    const r = x.r;
    const pct = Math.round(x.deficit*100);
    return `<div class="corr-item">
      <div class="corr-rank">${idx+1}º</div>
      <div class="corr-info">
        <div class="corr-range">${r.de} → ${r.ate}</div>
        <div class="corr-meta">Medido ${r.medida} MΩ (mín. ${(r.calculada||0).toFixed(2)} MΩ) · ${pct}% abaixo do mínimo</div>
        <div class="corr-meta" style="color:var(--muted);">OS Preventiva: ${r.os||'—'}</div>
      </div>
      <div class="corr-form">
        <input type="number" step="any" inputmode="decimal" class="corr-medida-input" data-deidx="${r.deIdx}" data-ateidx="${r.ateIdx}" placeholder="Nova medida (MΩ)">
        <button class="corr-save-btn" data-deidx="${r.deIdx}" data-ateidx="${r.ateIdx}" data-os="${r.os||''}">Salvar</button>
      </div>
    </div>`;
  }).join('');

  detail.innerHTML = `
    <div class="backbar" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Voltar</span>
    </div>
    <div class="dheader">
      <div class="dtag">${currentPista} · CORRETIVA</div>
      <div class="dname">${circ.nome}</div>
      <div class="dmeta">${osOrigemTxt}</div>
    </div>

    <div class="os-panel corr">
      <label>Nº da OS corretiva (obrigatório para salvar)</label>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="corrOsInput" placeholder="ex: 2001" value="${currentCorrOS}">
      ${recentOsListCorr.length ? `<div class="os-suggest">${recentOsListCorr.map(os=>`<button type="button" class="os-suggest-chip corr" data-os="${os}">${os}</button>`).join('')}</div>` : ''}
      <div class="os-hint">Vinculada à(s) OS preventiva(s) que identificaram estes trechos.</div>
    </div>

    <div class="pg-section-title">Trechos pendentes — do mais crítico pro menos crítico</div>
    ${pendentes.length ? rowsHtml : `<div class="pg-empty">✓ Nenhum trecho pendente neste circuito.</div>`}

    <div class="export-bar">
      <button class="secondary" id="corrExportBtn">Exportar planilha (.xlsx / WhatsApp)</button>
      <div class="hint">Exporta os registros salvos deste circuito sob a OS corretiva informada acima.</div>
      <button class="secondary" id="corrExportDocxBtn" style="margin-top:10px;">📄 Exportar relatório (.docx)</button>
      <div class="hint">Gera um relatório técnico em Word com os dados dessa corretiva.</div>
    </div>
  `;

  document.getElementById('backBtn').onclick = ()=>{ history.back(); };
  const corrOsInput = document.getElementById('corrOsInput');
  corrOsInput.oninput = (e)=>{ e.target.value = e.target.value.replace(/\D/g,''); currentCorrOS = e.target.value; };
  document.getElementById('corrExportBtn').onclick = ()=>{ activeExportOS = currentCorrOS; exportCircuit(); };
  document.getElementById('corrExportDocxBtn').onclick = ()=>{ activeExportOS = currentCorrOS; exportDocxCircuit(); };
  detail.querySelectorAll('.os-suggest-chip').forEach(chip=>{
    chip.onclick = ()=>{ corrOsInput.value = chip.dataset.os; currentCorrOS = chip.dataset.os; };
  });

  detail.querySelectorAll('.corr-save-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(!currentCorrOS || !/^\d+$/.test(currentCorrOS)){
        showToast('Digite o número da OS corretiva antes de salvar.');
        document.getElementById('corrOsInput').focus();
        return;
      }
      const deIdx = parseInt(btn.dataset.deidx,10);
      const ateIdx = parseInt(btn.dataset.ateidx,10);
      const sourceOs = btn.dataset.os;
      const input = detail.querySelector(`.corr-medida-input[data-deidx="${deIdx}"][data-ateidx="${ateIdx}"]`);
      const medida = parseFloat(input.value);
      if(isNaN(medida)){ showToast('Digite o valor medido antes de salvar.'); return; }
      const calc = computeRange(circ, deIdx, ateIdx);
      if(!calc){ showToast('Não consegui calcular esse trecho.'); return; }
      const situacao = medida >= calc.calculada ? 'NORMAL' : 'FALHA';
      const recs = loadRecords();
      recs.push({
        id: 'r'+Date.now()+Math.random().toString(36).slice(2,7),
        circId: circ.id, pista: currentPista, tipo: circ.tipo, circuito: circ.nome, tensao: circ.tensao,
        de: circ.pontos[calc.i].label, ate: circ.pontos[calc.j].label, deIdx: calc.i, ateIdx: calc.j,
        comprimento: calc.comprimento, trafos: calc.trafos, total_uA: calc.total_uA, calculada: calc.calculada,
        medida: medida, situacao: situacao,
        manut: 'corr', os: currentCorrOS, sourceOs: sourceOs,
        ts: Date.now(),
        foto: pendingFoto ? {dataUrl: pendingFoto.dataUrl, width: pendingFoto.width, height: pendingFoto.height} : null,
        lat: pendingGeo ? pendingGeo.lat : null,
        lng: pendingGeo ? pendingGeo.lng : null,
      });
      saveRecords(recs);
      saveLastOsForCircuit(circ.id, currentCorrOS);
      showToast(situacao==='NORMAL' ? 'Salvo — trecho corrigido, agora NORMAL.' : 'Salvo — ainda em FALHA.');
      renderCorretivaDetail();
    };
  });
}

// Tenta pegar a localização em segundo plano, sem travar a tela nem exigir
// nada do usuário. Se o navegador negar ou não tiver GPS, só ignora.
function tryCaptureGeo(){
  if(geoAttempted) return;
  geoAttempted = true;
  if(!navigator.geolocation){ updateGeoStatus(); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      pendingGeo = {lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy};
      updateGeoStatus();
    },
    err=>{ pendingGeo = null; updateGeoStatus(); },
    {enableHighAccuracy:true, timeout:8000, maximumAge:60000}
  );
}
function updateGeoStatus(){
  const el = document.getElementById('geoStatus');
  if(!el) return;
  if(pendingGeo){
    el.className = 'geo-status ok';
    el.textContent = `📍 Localização capturada (±${Math.round(pendingGeo.accuracy)}m) — vai junto no relatório.`;
  } else {
    el.className = 'geo-status err';
    el.textContent = '📍 Sem localização disponível (opcional, não impede salvar).';
  }
}

function renderFotoPreview(){
  const wrap = document.getElementById('fotoPreviewWrap');
  if(!wrap) return;
  if(pendingFoto){
    wrap.innerHTML = `<img class="foto-preview" src="${pendingFoto.dataUrl}">
      <button type="button" class="foto-remove" id="fotoRemoveBtn">Remover foto</button>`;
    document.getElementById('fotoRemoveBtn').onclick = ()=>{
      pendingFoto = null;
      renderFotoPreview();
    };
  } else {
    wrap.innerHTML = '';
  }
}

// Reduz a foto pra um tamanho leve (máx. 900px de largura, JPEG) antes de
// guardar, pra não estourar o armazenamento do celular com fotos grandes.
// Tamanho padrão (em pixels) que toda foto e todo gráfico usam no relatório
// — assim os dois saem exatamente do mesmo tamanho na tabela lado a lado,
// sem esticar/distorcer nada.
const REPORT_IMG_W = 640, REPORT_IMG_H = 400;

// Recorta uma foto (mantendo a proporção, sem distorcer — igual ao
// "object-fit: cover" do CSS) pra caber exatamente no tamanho padrão do
// relatório. A foto ORIGINAL salva no histórico não é alterada; isso só
// gera uma cópia usada na hora de montar o .docx.
function cropImageCover(dataUrl, targetW, targetH){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = targetW; canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      const srcRatio = img.width / img.height;
      const targetRatio = targetW / targetH;
      let sx, sy, sw, sh;
      if(srcRatio > targetRatio){
        // foto mais larga que o alvo -> corta as laterais
        sh = img.height; sw = sh * targetRatio;
        sx = (img.width - sw) / 2; sy = 0;
      } else {
        // foto mais alta que o alvo -> corta topo/base
        sw = img.width; sh = sw / targetRatio;
        sx = 0; sy = (img.height - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{ img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = ()=>{
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve({dataUrl: canvas.toDataURL('image/jpeg', 0.6), width:w, height:h});
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Transforma o SVG do gráfico de tendência numa imagem JPEG de verdade
// (via canvas), pra poder embutir no relatório .docx — o Word não abre
// SVG embutido de forma confiável, mas abre JPEG/PNG sem problema.
// Desenha o gráfico de tendência direto no <canvas> (sem passar por SVG),
// pra ser confiável em qualquer navegador/celular na hora de virar imagem
// pro relatório .docx. Não é assíncrono — desenho de canvas é sempre síncrono.
function drawTrendChartToCanvas(records, calculada){
  const W = REPORT_IMG_W, H = REPORT_IMG_H, padL = 60, padR = 24, padT = 24, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // fundo branco (documento é branco, cores escuras aqui)
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);

  const values = records.map(r=>r.medida).concat([calculada]);
  const maxV = Math.max(...values) * 1.1 || 1;
  const minV = 0;
  const n = records.length;
  const xFor = i => n<=1 ? padL + plotW/2 : padL + (i/(n-1))*plotW;
  const yFor = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;

  // eixos
  ctx.strokeStyle = '#999999';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT); ctx.lineTo(padL, H-padB); ctx.lineTo(W-padR, H-padB);
  ctx.stroke();

  // linha pontilhada do mínimo admissível
  const yCalc = yFor(calculada);
  ctx.strokeStyle = '#C9860A';
  ctx.setLineDash([6,4]);
  ctx.beginPath();
  ctx.moveTo(padL, yCalc); ctx.lineTo(W-padR, yCalc);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#C9860A';
  ctx.font = '12px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`mínimo ${calculada.toFixed(1)} MΩ`, W-padR, yCalc-6);

  // linha da série
  if(n>1){
    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    records.forEach((r,i)=>{
      const x = xFor(i), y = yFor(r.medida);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }

  // pontos
  records.forEach((r,i)=>{
    const x = xFor(i), y = yFor(r.medida);
    ctx.fillStyle = r.situacao==='NORMAL' ? '#1D9A6C' : '#D8392F';
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // datas nas pontas
  ctx.fillStyle = '#555555';
  ctx.font = '11px monospace';
  if(n>=1){
    ctx.textAlign = 'left';
    ctx.fillText(new Date(records[0].ts).toLocaleDateString('pt-BR'), padL, H-12);
  }
  if(n>=2){
    ctx.textAlign = 'right';
    ctx.fillText(new Date(records[n-1].ts).toLocaleDateString('pt-BR'), W-padR, H-12);
  }

  return {dataUrl: canvas.toDataURL('image/jpeg', 0.9), width:W, height:H};
}

// Igual ao gráfico de tendência normal, mas com DUAS linhas no mesmo
// desenho: a evolução da preventiva (âmbar) e a da corretiva que resolveu
// aquele trecho (verde), deixando visível a melhoria entre as duas.
function drawDualLineChart(prevRecs, corrRecs, calculada, legendaEsquerda, legendaDireita){
  const W = REPORT_IMG_W, H = REPORT_IMG_H, padL = 60, padR = 24, padT = 34, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);

  const all = prevRecs.concat(corrRecs);
  const values = all.map(r=>r.medida).concat([calculada]);
  const maxV = Math.max(...values) * 1.1 || 1;
  const minV = 0;
  // eixo X: ordem cronológica combinada (preventiva sempre antes da corretiva)
  const n = all.length;
  const xFor = i => n<=1 ? padL + plotW/2 : padL + (i/(n-1))*plotW;
  const yFor = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;

  ctx.strokeStyle = '#999999';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT); ctx.lineTo(padL, H-padB); ctx.lineTo(W-padR, H-padB);
  ctx.stroke();

  const yCalc = yFor(calculada);
  ctx.strokeStyle = '#C9860A';
  ctx.setLineDash([6,4]);
  ctx.beginPath();
  ctx.moveTo(padL, yCalc); ctx.lineTo(W-padR, yCalc);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#C9860A';
  ctx.font = '12px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`mínimo ${calculada.toFixed(1)} MΩ`, W-padR, yCalc-6);

  // legenda no topo
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#C9860A'; ctx.fillText('● Preventiva', padL, 16);
  ctx.fillStyle = '#1D9A6C'; ctx.fillText('● Corretiva', padL+130, 16);

  function drawSeries(recs, offset, color){
    if(recs.length===0) return;
    if(recs.length>1){
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      recs.forEach((r,i)=>{
        const x = xFor(offset+i), y = yFor(r.medida);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
    }
    recs.forEach((r,i)=>{
      const x = xFor(offset+i), y = yFor(r.medida);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
  }
  drawSeries(prevRecs, 0, '#C9860A');
  drawSeries(corrRecs, prevRecs.length, '#1D9A6C');

  // linha tracejada fina ligando o último ponto da preventiva ao primeiro
  // da corretiva, deixando clara a transição entre as duas fases
  if(prevRecs.length>0 && corrRecs.length>0){
    ctx.strokeStyle = '#999999';
    ctx.setLineDash([3,3]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(xFor(prevRecs.length-1), yFor(prevRecs[prevRecs.length-1].medida));
    ctx.lineTo(xFor(prevRecs.length), yFor(corrRecs[0].medida));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle = '#555555';
  ctx.font = '11px monospace';
  if(all.length>=1){
    ctx.textAlign = 'left';
    ctx.fillText(new Date(all[0].ts).toLocaleDateString('pt-BR'), padL, H-12);
  }
  if(all.length>=2){
    ctx.textAlign = 'right';
    ctx.fillText(new Date(all[all.length-1].ts).toLocaleDateString('pt-BR'), W-padR, H-12);
  }

  return {dataUrl: canvas.toDataURL('image/jpeg', 0.9), width:W, height:H};
}

// Gráfico de barras: uma barra por trecho do circuito, altura = medida
// (MΩ), verde se normal / vermelho se em falha. Bate o olho rápido em
// qual trecho está comprometido, sem rolar página por página.
function drawBarChartForCircuit(circLabel, items){
  const W = 960, H = 480, padL = 60, padR = 20, padT = 30, padB = 90;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#222222';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(circLabel, padL, 18);

  const n = items.length;
  const maxV = Math.max(...items.map(it=>it.medida)) * 1.15 || 1;
  const slot = plotW / n;
  const barW = Math.min(slot * 0.6, 46);
  const yFor = v => padT + plotH - (v/maxV)*plotH;

  // eixo
  ctx.strokeStyle = '#999999';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT); ctx.lineTo(padL, H-padB); ctx.lineTo(W-padR, H-padB);
  ctx.stroke();

  items.forEach((it, i)=>{
    const cx = padL + slot*i + slot/2;
    const x = cx - barW/2;
    const y = yFor(it.medida);
    const h = (H-padB) - y;
    ctx.fillStyle = it.situacao==='NORMAL' ? '#1D9A6C' : '#D8392F';
    ctx.fillRect(x, y, barW, h);
    // valor em cima da barra
    ctx.fillStyle = '#333333';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    const valTxt = it.medida>=1000 ? (it.medida/1000).toFixed(1)+'k' : String(it.medida);
    ctx.fillText(valTxt, cx, Math.max(y-4, 12));
    // rótulo do trecho (rotacionado, senão não cabe)
    ctx.save();
    ctx.translate(cx, H-padB+8);
    ctx.rotate(-Math.PI/4);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#555555';
    ctx.font = '10px monospace';
    ctx.fillText(it.label, 0, 0);
    ctx.restore();
  });

  return {dataUrl: canvas.toDataURL('image/jpeg', 0.9), width:W, height:H};
}

// Gráfico ÚNICO e consolidado: uma barra por circuito, altura = razão
// entre o pior trecho medido e o seu próprio mínimo normativo (1.0 = na
// linha de corte). Verde acima da linha, vermelho abaixo — dá visão
// executiva da pista inteira numa imagem só, sem precisar abrir gráfico
// por gráfico.
function drawConsolidatedComplianceChart(items){
  const W = 980, H = 500, padL = 60, padR = 20, padT = 30, padB = 110;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);

  const CAP = 2.0; // teto visual da barra (1.0 = linha de corte); valores
  // maiores só "encostam" no teto, mas o rótulo mostra o valor real.
  const n = items.length;
  const slot = plotW / n;
  const barW = Math.min(slot * 0.55, 40);
  const yFor = ratio => padT + plotH - (Math.min(ratio, CAP)/CAP)*plotH;
  const yLine = yFor(1.0);

  ctx.strokeStyle = '#999999';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT); ctx.lineTo(padL, H-padB); ctx.lineTo(W-padR, H-padB);
  ctx.stroke();

  ctx.strokeStyle = '#C9860A';
  ctx.setLineDash([6,4]);
  ctx.beginPath();
  ctx.moveTo(padL, yLine); ctx.lineTo(W-padR, yLine);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#C9860A';
  ctx.font = '11px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('limite normativo (100% do mínimo)', W-padR, yLine-6);

  items.forEach((it, i)=>{
    const cx = padL + slot*i + slot/2;
    const x = cx - barW/2;
    const y = yFor(it.ratio);
    const h = (H-padB) - y;
    ctx.fillStyle = it.ratio>=1 ? '#1D9A6C' : '#D8392F';
    ctx.fillRect(x, y, barW, h);
    ctx.fillStyle = '#333333';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.round(it.ratio*100)}%`, cx, Math.max(y-4, 12));
    ctx.save();
    ctx.translate(cx, H-padB+8);
    ctx.rotate(-Math.PI/4);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#555555';
    ctx.font = '10px monospace';
    ctx.fillText(it.label, 0, 0);
    ctx.restore();
  });

  return {dataUrl: canvas.toDataURL('image/jpeg', 0.9), width:W, height:H};
}

// ---------------------------------------------------------------
// RELATÓRIO DO PAINEL GERAL — visão de auditoria, sem fotos, focado em
// números de OS (preventiva/corretiva) e na evolução dos trechos que
// tiveram corretiva (preventiva x corretiva no mesmo gráfico).
// ---------------------------------------------------------------
async function exportPainelGeralRelatorio(){
  try{
    const circuits = (CIRCUIT_DATA[currentPista]||[]).filter(c=>!c.sem_dados);
    const doc = new SimpleDocx();
    const hoje = new Date().toLocaleDateString('pt-BR');

    doc.heading('RELATÓRIO GERAL DE ISOLAÇÃO — AUDITORIA', 1);
    doc.paragraph(`Pista: ${currentPista}`);
    doc.paragraph(`Data de emissão: ${hoje}`);

    doc.heading('1. Tabela mestra — resumo por circuito', 2);
    const tableHeaders = ['Circuito/Subsistema','Trechos Totais','Trechos c/ Pendência','Menor Isolação (MΩ)','OS Preventiva','OS Corretiva','Status Final'];
    const tableRows = [];
    const rowHighlights = [];
    const consolidatedItems = []; // pro gráfico único da seção 2
    const circuitosComPendencia = []; // pro anexo da seção 3

    circuits.forEach(circ=>{
      const vals = Object.values(latestByRangeMap(circ)).filter(r=>r.manut==='prev'||r.manut==='corr');
      if(vals.length===0) return;
      const falhas = vals.filter(r=>r.situacao==='FALHA');
      const comPendencia = falhas.length>0;
      // "pior trecho" = o que está mais longe do próprio mínimo (pior razão medida/mínimo)
      const pior = vals.reduce((worst, r)=>{
        const ratio = r.calculada>0 ? r.medida/r.calculada : 999;
        const worstRatio = worst.calculada>0 ? worst.medida/worst.calculada : 999;
        return ratio<worstRatio ? r : worst;
      }, vals[0]);
      const piorRatio = pior.calculada>0 ? pior.medida/pior.calculada : 1;
      const prevOsList = [...new Set(vals.filter(r=>r.manut==='prev').map(r=>r.os).filter(Boolean))];
      const corrOsList = [...new Set(vals.filter(r=>r.manut==='corr').map(r=>r.os).filter(Boolean))];

      tableRows.push([
        circLabel(circ),
        vals.length,
        falhas.length,
        `${pior.medida} (Mín: ${(pior.calculada||0).toFixed(1)})`,
        prevOsList.join(', ')||'—',
        corrOsList.join(', ')||'—',
        comPendencia ? 'COM PENDÊNCIA' : 'NORMAL'
      ]);
      rowHighlights.push(comPendencia);
      consolidatedItems.push({label: circLabel(circ), ratio: piorRatio});
      if(comPendencia) circuitosComPendencia.push(circ);
    });

    if(tableRows.length===0){
      doc.paragraph('Nenhum circuito com medições registradas ainda nesta pista.');
    } else {
      doc.table(tableHeaders, tableRows, rowHighlights);
    }

    // 2) Gráfico ÚNICO consolidado — pior trecho de cada circuito vs seu
    // próprio limite normativo. Visão executiva da pista inteira numa
    // imagem só: barras verdes acima da linha = pista liberada; qualquer
    // barra vermelha aponta na hora quais circuitos precisam de atenção.
    doc.heading('2. Comparativo geral — pior trecho de cada circuito', 2);
    if(consolidatedItems.length===0){
      doc.paragraph('Nenhum circuito com medições registradas ainda nesta pista.');
    } else {
      const chart = drawConsolidatedComplianceChart(consolidatedItems);
      doc.image(chart.dataUrl, chart.width, chart.height, [
        `${currentPista} — ${consolidatedItems.length} circuito(s)`,
        'Barra = pior trecho medido, em % do próprio mínimo normativo. Abaixo de 100% = pendência.'
      ]);
    }

    // 3) Anexo técnico — detalhamento sob demanda. Só os circuitos COM
    // PENDÊNCIA ganham gráfico individual aqui (barras por trecho +
    // evolução ano a ano, se houver histórico do circuito inteiro).
    // Circuitos normais não geram gráfico nenhum, o relatório fica enxuto.
    doc.heading('3. Anexo técnico — detalhamento dos circuitos com pendência', 2);
    if(circuitosComPendencia.length===0){
      doc.paragraph('Nenhum circuito com pendência nesta pista — sem detalhamento necessário.');
    } else {
      circuitosComPendencia.forEach(circ=>{
        const latest = Object.values(latestByRangeMap(circ)).filter(r=>r.manut==='prev'||r.manut==='corr');
        const ordered = latest.sort((a,b)=>recordPosition(circ,a)-recordPosition(circ,b));
        const items = ordered.map(r=>({label: `${r.de}→${r.ate}`, medida: r.medida, situacao: r.situacao}));
        const barChart = drawBarChartForCircuit(circLabel(circ), items);
        const osList = [...new Set(ordered.map(r=>r.os))].filter(Boolean).join(', ');
        doc.image(barChart.dataUrl, barChart.width, barChart.height, [
          `${circLabel(circ)} — ${items.length} trecho(s) medido(s)`,
          `OS: ${osList||'—'}`
        ]);

        const lastIdx = circ.pontos.length-1;
        const hist = getTrendHistory(circ, 0, lastIdx);
        if(hist.length>1){
          const calc = computeRange(circ, 0, lastIdx);
          const calculada = calc ? calc.calculada : (hist[hist.length-1].calculada||0);
          const lineChart = drawTrendChartToCanvas(hist, calculada);
          const osHist = [...new Set(hist.map(r=>r.os))].filter(Boolean).join(', ');
          doc.image(lineChart.dataUrl, lineChart.width, lineChart.height, [
            `${circLabel(circ)} — Se-NA → Se-NA, evolução ao longo do tempo`,
            `OS: ${osHist||'—'}`
          ]);
        }
      });
    }

    const bytes = doc.toBytes();
    const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const filename = `relatorio_auditoria_${currentPista.replace(/\//g,'-')}.docx`;
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Relatório de auditoria — '+currentPista});
        return;
      }catch(e){ if(e && e.name==='AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('Relatório baixado: '+filename);
  }catch(e){
    console.error('Falha ao gerar relatório do painel geral:', e);
    showErrorPanel('Erro ao gerar relatório da auditoria:', (e && e.stack) || String(e));
  }
}

// Point labels can repeat (loop circuits start/end at the same physical point,
// e.g. "Se-NA" -> ... -> "Se-NA"), so selection must use position in the chain,
// never the label text, or "De"/"Até" collapse onto the same point.
function computeRange(circ, i, j){
  if(i==null||j==null||i<0||j<0) return null;
  if(i>j){ const t=i; i=j; j=t; }
  let comprimento, trafos;
  // Circuito inteiro (do início ao fim da cadeia): usa o total OFICIAL da
  // planilha (linha de resumo), não a soma dos trechos — porque o total
  // oficial inclui o cabo de ida/volta até a subestação, que não aparece
  // detalhado luminária por luminária (ver manual Metrol, item 7.2.1-b).
  const isCircuitoInteiro = i===0 && j===circ.pontos.length-1;
  if(isCircuitoInteiro && circ.resumo && circ.resumo.comprimento_total!=null && circ.resumo.trafos_total!=null){
    comprimento = circ.resumo.comprimento_total;
    trafos = circ.resumo.trafos_total;
  }else{
    const p1 = circ.pontos[i], p2 = circ.pontos[j];
    comprimento = p2.cum_len - p1.cum_len;
    trafos = p2.cum_trafos - p1.cum_trafos;
  }
  const cabo_uA = comprimento/100;
  const trafos_uA = trafos*2;
  const total_uA = cabo_uA + trafos_uA;
  const calculada = total_uA>0 ? (circ.tensao/total_uA) : 0;
  return {i,j,comprimento,trafos,cabo_uA,trafos_uA,total_uA,calculada};
}

// ---------------------------------------------------------------
// BUSCA LIVRE POR LUMINÁRIA (estimativa proporcional dentro de um trecho
// oficial da planilha, pra não travar só nos pontos que já existem lá).
// Quando distâncias exatas forem adicionadas depois, é só recriar o ponto
// oficial no dado de origem que a estimativa deixa de ser necessária.
// ---------------------------------------------------------------
function pointNumberOf(label){
  const s = String(label).trim();
  return /^\d+$/.test(s) ? parseInt(s,10) : null;
}
function numericPoints(circ){
  return circ.pontos.map((p,idx)=>({idx, num: pointNumberOf(p.label), p})).filter(x=>x.num!==null);
}
// Pontos "nomeados" do circuito (Se-NA, 11L, 29R, etc.) — tudo que não é
// número de luminária. Servem como origem/destino alternativos na busca livre.
function namedPoints(circ){
  const seen = new Set();
  return circ.pontos.filter(p=>{
    if(pointNumberOf(p.label)!==null) return false;
    const key = p.label.trim().toUpperCase();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function circuitSupportsFreeSearch(circ){
  return numericPoints(circ).length >= 2;
}
// Resolve um valor digitado (número de luminária OU rótulo nomeado, ex.
// "Se-NA", "11L") pra uma posição na cadeia do circuito.
function resolveFreeSearchToken(circ, token){
  const s = String(token||'').trim();
  if(s===''){ return null; }
  if(/^\d+$/.test(s)){
    return locateWithinSegment(circ, parseInt(s,10));
  }
  const norm = s.toUpperCase().replace(/\s+/g,'');
  const match = circ.pontos.find(p=>p.label.trim().toUpperCase().replace(/\s+/g,'')===norm);
  if(match) return {cum_len: match.cum_len, cum_trafos: match.cum_trafos, exact:true};
  return null;
}
// Localiza o trecho oficial (par de pontos consecutivos) que contém o número
// pedido, e devolve a posição proporcional dele dentro desse trecho.
function locateWithinSegment(circ, num){
  const np = numericPoints(circ);
  const exact = np.find(x=>x.num===num);
  if(exact) return {cum_len: exact.p.cum_len, cum_trafos: exact.p.cum_trafos, exact:true};
  for(let k=0;k<np.length-1;k++){
    const a=np[k], b=np[k+1];
    const lo=Math.min(a.num,b.num), hi=Math.max(a.num,b.num);
    if(num>lo && num<hi){
      // qtd de luminárias no trecho oficial = diferença de numeração (assume 1 por luminária)
      const qtdLampadas = Math.abs(b.num-a.num);
      const f = (num-a.num)/(b.num-a.num);
      return {
        cum_len: a.p.cum_len + f*(b.p.cum_len-a.p.cum_len),
        cum_trafos: a.p.cum_trafos + f*(b.p.cum_trafos-a.p.cum_trafos),
        exact:false,
        trechoBase: {de:a.p.label, ate:b.p.label, comprimento:Math.abs(b.p.cum_len-a.p.cum_len),
          trafos:Math.abs(b.p.cum_trafos-a.p.cum_trafos), qtdLampadas}
      };
    }
  }
  return null; // fora da faixa conhecida — não estima
}
function computeFreeSearch(circ, tokenDe, tokenAte){
  let a = resolveFreeSearchToken(circ, tokenDe);
  let b = resolveFreeSearchToken(circ, tokenAte);
  if(!a||!b) return null;
  if(a.cum_len>b.cum_len){ const t=a;a=b;b=t; }
  const comprimento = Math.round((b.cum_len-a.cum_len)*10)/10;
  // Trafo é unidade inteira (1 por luminária) — nunca fracionário.
  const trafos = Math.round(b.cum_trafos-a.cum_trafos);
  const total_uA = comprimento/100 + trafos*2;
  const calculada = total_uA>0 ? (circ.tensao/total_uA) : 0;
  const estimado = !(a.exact && b.exact);
  return {comprimento,trafos,total_uA,calculada,estimado};
}

// Sugere o próximo trecho na sequência lógica de campo: Se-NA→Se-NA
// (circuito inteiro) primeiro, depois Se-NA→1º ponto, depois 1º→2º ponto,
// e assim por diante, seguindo a ordem física da cadeia.
function suggestNextRange(circ){
  const recs = loadRecords().filter(r=>r.circId===circ.id && r.os===currentOS && r.manut==='prev');
  const lastIdx = circ.pontos.length-1;
  if(recs.length===0) return {i:0, j:lastIdx};
  const hasFull = recs.some(r=>r.deIdx===0 && r.ateIdx===lastIdx);
  if(!hasFull) return {i:0, j:lastIdx};
  const subs = recs.filter(r=>!(r.deIdx===0 && r.ateIdx===lastIdx));
  if(subs.length===0) return lastIdx>=1 ? {i:0, j:1} : null;
  const maxJ = Math.max(...subs.map(r=>r.ateIdx));
  if(maxJ+1<=lastIdx) return {i:maxJ, j:maxJ+1};
  return null; // sequência completa
}

      fsResult.innerHTML = `

function updateStatusPill(){
  const detail = document.getElementById('detail');
  const medidaInput = document.getElementById('medidaInput');
  const pillWrap = document.getElementById('statusPill');
  const calc = computeRange(currentCircuit, selDeIdx, selAteIdx);
  const medida = parseFloat(medidaInput.value);
  if(!calc || isNaN(medida)){ pillWrap.innerHTML=''; return; }
  const ok = medida >= calc.calculada;
  pillWrap.innerHTML = `<div class="status-pill ${ok?'ok':'alert'}"><div class="dot"></div>${ok?'NORMAL':'TRECHO COM POTENCIAL DE FALHA'}</div>`;
}

function saveMeasurement(){
  if(!currentOS || !/^\d+$/.test(currentOS)){
    showToast('Digite o número da OS antes de salvar — é obrigatório para este circuito.');
    document.getElementById('osInput').focus();
    return;
  }
  const medidaInput = document.getElementById('medidaInput');
  const medida = parseFloat(medidaInput.value);
  if(isNaN(medida)){ showToast('Digite o valor medido antes de salvar.'); return; }
  const calc = computeRange(currentCircuit, selDeIdx, selAteIdx);
  if(!calc){ showToast('Selecione pontos válidos.'); return; }
  const situacao = medida >= calc.calculada ? 'NORMAL' : 'FALHA';
  const recs = loadRecords();
  const deLabel = currentCircuit.pontos[calc.i].label;
  const ateLabel = currentCircuit.pontos[calc.j].label;
  recs.push({
    id: 'r'+Date.now()+Math.random().toString(36).slice(2,7),
    circId: currentCircuit.id,
    pista: currentPista,
    tipo: currentCircuit.tipo,
    circuito: currentCircuit.nome,
    tensao: currentCircuit.tensao,
    de: deLabel, ate: ateLabel, deIdx: calc.i, ateIdx: calc.j,
    comprimento: calc.comprimento, trafos: calc.trafos,
    total_uA: calc.total_uA, calculada: calc.calculada,
    medida: medida, situacao: situacao,
    manut: selTipo, // 'prev' | 'corr'
    os: currentOS,
    ts: Date.now(),
    foto: pendingFoto ? {dataUrl: pendingFoto.dataUrl, width: pendingFoto.width, height: pendingFoto.height} : null,
    lat: pendingGeo ? pendingGeo.lat : null,
    lng: pendingGeo ? pendingGeo.lng : null,
  });
  saveRecords(recs);
  saveLastOsForCircuit(currentCircuit.id, currentOS);
  showToast(situacao==='NORMAL' ? 'Salvo — trecho NORMAL.' : 'Salvo — TRECHO COM POTENCIAL DE FALHA.');
  pendingFoto = null;
  // avança automaticamente pro próximo trecho da sequência e redesenha a
  // tela inteira — sem isso, a sugestão ficava "congelada" na mesma depois
  // de salvar, e o campo de medida continuava com o valor antigo.
  const next = suggestNextRange(currentCircuit);
  if(next){ selDeIdx = next.i; selAteIdx = next.j; }
  document.getElementById('detail').dataset.medida = '';
  renderDetail();
}

// ---------------------------------------------------------------
// GRÁFICO DE TENDÊNCIA — mostra todas as medições já salvas para UM
// trecho específico ao longo do tempo (não só a última), num SVG
// desenhado na mão, sem depender de nenhuma biblioteca de gráfico.
// ---------------------------------------------------------------
function getTrendHistory(circ, deIdx, ateIdx){
  const recs = loadRecords().filter(r=>r.circId===circ.id);
  const matching = recs.filter(r=>{
    const i = r.deIdx!=null ? r.deIdx : recordPosition(circ, r);
    let j = r.ateIdx;
    if(j==null){
      j=-1;
      for(let k=0;k<circ.pontos.length;k++){ if(circ.pontos[k].label===r.ate && k>i){ j=k; break; } }
      if(j===-1) j = circ.pontos.findIndex(p=>p.label===r.ate);
    }
    return i===deIdx && j===ateIdx;
  });
  return matching.sort((a,b)=>a.ts-b.ts);
}

function buildTrendSvg(records, calculada, opts){
  opts = opts || {};
  const light = !!opts.light;
  const bg = light ? '#FFFFFF' : 'none';
  const axisColor = light ? '#999999' : '#232E38';
  const textColor = light ? '#555555' : '#7E8FA0';
  const lineColor = light ? '#555555' : '#7E8FA0';
  const calcColor = '#C9860A';
  const W = 560, H = 180, padL = 44, padR = 16, padT = 16, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const values = records.map(r=>r.medida).concat([calculada]);
  const maxV = Math.max(...values) * 1.1 || 1;
  const minV = 0;
  const n = records.length;
  const xFor = i => n<=1 ? padL + plotW/2 : padL + (i/(n-1))*plotW;
  const yFor = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;

  const yCalc = yFor(calculada);
  const pathPts = records.map((r,i)=>`${xFor(i).toFixed(1)},${yFor(r.medida).toFixed(1)}`).join(' ');

  const dots = records.map((r,i)=>{
    const color = r.situacao==='NORMAL' ? '#1D9A6C' : '#D8392F';
    return `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(r.medida).toFixed(1)}" r="4" fill="${color}" stroke="${light?'#FFFFFF':'#0A0E12'}" stroke-width="1.5"/>`;
  }).join('');

  // eixo X: mostra só a primeira e a última data, pra não poluir
  let xLabels = '';
  if(n>=1){
    const first = new Date(records[0].ts).toLocaleDateString('pt-BR');
    xLabels += `<text x="${padL}" y="${H-8}" font-size="9" fill="${textColor}" font-family="monospace">${first}</text>`;
  }
  if(n>=2){
    const last = new Date(records[n-1].ts).toLocaleDateString('pt-BR');
    xLabels += `<text x="${W-padR}" y="${H-8}" font-size="9" fill="${textColor}" font-family="monospace" text-anchor="end">${last}</text>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:${bg};">
    <rect x="0" y="0" width="${W}" height="${H}" fill="${bg}"/>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="${axisColor}"/>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="${axisColor}"/>
    <line x1="${padL}" y1="${yCalc.toFixed(1)}" x2="${W-padR}" y2="${yCalc.toFixed(1)}" stroke="${calcColor}" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="${W-padR}" y="${(yCalc-4).toFixed(1)}" font-size="9" fill="${calcColor}" font-family="monospace" text-anchor="end">mínimo ${calculada.toFixed(1)} MΩ</text>
    ${n>1 ? `<polyline points="${pathPts}" fill="none" stroke="${lineColor}" stroke-width="1.5"/>` : ''}
    ${dots}
    ${xLabels}
  </svg>`;
}

function openTrendPanel(circ, deIdx, ateIdx){
  const records = getTrendHistory(circ, deIdx, ateIdx);
  if(records.length===0) return;
  const deLabel = circ.pontos[deIdx] ? circ.pontos[deIdx].label : '?';
  const ateLabel = circ.pontos[ateIdx] ? circ.pontos[ateIdx].label : '?';
  const calc = computeRange(circ, deIdx, ateIdx);
  const calculada = calc ? calc.calculada : (records[records.length-1].calculada || 0);

  const rowsHtml = records.slice().reverse().map(r=>{
    const d = new Date(r.ts);
    const dateStr = d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    return `<div class="trend-row">
      <span>${dateStr}${r.os?` · OS ${r.os}${r.manut==='corr'?' (corretiva)':''}`:''}</span>
      <span>${r.medida} MΩ</span>
      <span class="badge ${r.situacao==='NORMAL'?'ok':'alert'}">${r.situacao==='NORMAL'?'Normal':'Falha'}</span>
    </div>`;
  }).join('');

  // aviso simples de tendência de queda: compara a primeira e a última medição
  let tendenciaHtml = '';
  if(records.length>=2){
    const primeira = records[0].medida, ultima = records[records.length-1].medida;
    if(ultima < primeira){
      const queda = Math.round((1 - ultima/primeira)*100);
      tendenciaHtml = `<div class="trend-hint" style="color:#ffb3ae;">⚠ Caiu ${queda}% desde a primeira medição registrada — vale acompanhar de perto.</div>`;
    } else {
      tendenciaHtml = `<div class="trend-hint" style="color:#34D399;">✓ Estável ou melhorando desde a primeira medição registrada.</div>`;
    }
  }

  document.getElementById('trendPanel').innerHTML = `
    <div class="trend-header">
      <div class="trend-title">${deLabel} → ${ateLabel}</div>
      <button class="trend-close" id="trendCloseBtn">✕</button>
    </div>
    <div class="trend-sub">${circLabel(circ)} · ${records.length} medição(ões) registrada(s)</div>
    <div class="trend-chart-wrap">${buildTrendSvg(records, calculada)}</div>
    ${tendenciaHtml}
    <div class="pg-section-title">Histórico completo deste trecho</div>
    ${rowsHtml}
  `;
  document.getElementById('trendOverlay').classList.add('show');
  document.getElementById('trendCloseBtn').onclick = ()=>{
    document.getElementById('trendOverlay').classList.remove('show');
  };
}
document.getElementById('trendOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='trendOverlay') document.getElementById('trendOverlay').classList.remove('show');
});

function renderHistory(){
  const histList = document.getElementById('histList');
  const histCount = document.getElementById('histCount');
  const recs = loadRecords().filter(r=>r.circId===currentCircuit.id && r.os===currentOS);
  // group by de|ate, keep only latest (última modificação)
  const latestByRange = {};
  recs.forEach(r=>{
    const key = groupKeyFor(currentCircuit, r);
    if(!latestByRange[key] || r.ts>latestByRange[key].ts) latestByRange[key]=r;
  });
  const list = Object.values(latestByRange).sort((a,b)=>recordPosition(currentCircuit,a)-recordPosition(currentCircuit,b));
  histCount.textContent = list.length ? list.length+' trecho(s)' : '';
  if(list.length===0){
    histList.innerHTML = '<div class="hist-empty">Nenhum registro salvo ainda para este circuito.</div>';
    return;
  }
  histList.innerHTML = list.map(r=>{
    const d = new Date(r.ts);
    const dateStr = d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const manutLabel = r.manut==='corr' ? 'Corretiva' : 'Preventiva';
    const deIdx = r.deIdx!=null ? r.deIdx : recordPosition(currentCircuit, r);
    const ateIdx = r.ateIdx!=null ? r.ateIdx : (()=>{ 
      let j=-1;
      for(let k=0;k<currentCircuit.pontos.length;k++){ if(currentCircuit.pontos[k].label===r.ate && k>deIdx){ j=k; break; } }
      return j===-1 ? currentCircuit.pontos.findIndex(p=>p.label===r.ate) : j;
    })();
    // Se esse trecho está em falha, mostra a OS corretiva vinculada (se já
    // houver uma) — olha em TODA a base, não só na OS ativa desta tela.
    let corrTag = '';
    if(r.situacao!=='NORMAL'){
      const allRecs = loadRecords().filter(x=>x.circId===currentCircuit.id && x.manut==='corr' && x.deIdx===deIdx && x.ateIdx===ateIdx);
      const lastCorr = allRecs.sort((a,b)=>b.ts-a.ts)[0];
      corrTag = `<div class="meta" style="color:#ff8a82;">${lastCorr ? `Corretiva OS: ${lastCorr.os}` : 'Corretiva ainda não aberta'}</div>`;
    }
    return `<div class="hist-item" data-deidx="${deIdx}" data-ateidx="${ateIdx}">
      <div class="l">
        <div class="rng">${r.de} → ${r.ate} · ${r.medida} MΩ ${r.foto?'📷':''}${r.lat!=null?'📍':''}</div>
        <div class="meta">${manutLabel} · ${dateStr}</div>
        ${corrTag}
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="hist-badge ${r.situacao==='NORMAL'?'ok':'alert'}">${r.situacao==='NORMAL'?'Normal':'Falha'}</div>
        <button class="hist-trend" data-deidx2="${deIdx}" data-ateidx2="${ateIdx}" title="Ver tendência">📈</button>
        <button class="hist-del" data-id="${r.id}" title="Excluir">✕</button>
      </div>
    </div>`;
  }).join('');
  histList.querySelectorAll('.hist-trend').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      openTrendPanel(currentCircuit, parseInt(btn.dataset.deidx2,10), parseInt(btn.dataset.ateidx2,10));
    };
  });
  histList.querySelectorAll('.hist-item').forEach(item=>{
    item.onclick = (e)=>{
      if(e.target.closest('.hist-del')) return;
      openTrendPanel(currentCircuit, parseInt(item.dataset.deidx,10), parseInt(item.dataset.ateidx,10));
    };
  });
  histList.querySelectorAll('.hist-del').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      let recs = loadRecords();
      recs = recs.filter(r=>r.id!==btn.dataset.id);
      saveRecords(recs);
      renderHistory(); renderList();
    };
  });
}

function csvEscape(v){
  v = String(v);
  if(v.includes(';')||v.includes('"')||v.includes('\n')){ return '"'+v.replace(/"/g,'""')+'"'; }
  return v;
}

// ---------------------------------------------------------------
// EXPORT XLSX — réplica fiel do layout da planilha original: duas
// linhas de cabeçalho mescladas (Descrição / Corrente de Fuga admissível /
// Resistência de Isolação / Análise), TODOS os trechos do circuito (não
// só os que já foram medidos), com "Medida" preenchida pelo registro mais
// recente salvo/importado pra cada trecho, e vazia onde ainda não há medição.
// ---------------------------------------------------------------
function buildStyledXlsxForCircuit(circ){
  // último registro salvo (ou importado) por trecho, indexado por De|Até
  const recs = loadRecords().filter(r=>r.circId===circ.id && r.os===activeExportOS);
  const latestByKey = {};
  recs.forEach(r=>{
    const key = groupKeyFor(circ, r);
    if(!latestByKey[key] || r.ts>latestByKey[key].ts) latestByKey[key]=r;
  });
  function findRecordFor(deLabel, ateLabel){
    // tenta achar pelo índice exato do ponto na cadeia (mais confiável, pois
    // rótulos podem se repetir em circuitos fechados em laço)
    const i = circ.pontos.findIndex(p=>p.label===deLabel);
    let j=-1;
    for(let k=0;k<circ.pontos.length;k++){ if(circ.pontos[k].label===ateLabel && k>i){ j=k; break; } }
    if(j===-1) j = circ.pontos.findIndex(p=>p.label===ateLabel);
    const byIdx = latestByKey[i+'|'+j];
    if(byIdx) return byIdx;
    return latestByKey[deLabel+'|'+ateLabel] || null;
  }
  // Linha de resumo (circuito inteiro): prioriza a MEDIÇÃO REAL feita em
  // campo pelo técnico (registro salvo De=0 Até=último ponto), e só cai
  // pro valor de referência da planilha original se ainda não foi medido.
  function findFullCircuitRecord(){
    return latestByKey['0|'+(circ.pontos.length-1)] || null;
  }

  const wb = new SimpleXlsx('Análise das medições');
  wb.setColWidths([11, 8, 12, 10, 13, 13, 13, 11, 8, 8, 8, 12, 11, 24, 9]);

  const GROUP_FILL = 'FFD9D9D9';
  const HEADER_STYLE = { bold:true, fill:GROUP_FILL, border:true, borderColor:'808080', align:{h:'center', v:'center', wrap:true} };
  const CELL_STYLE_LEFT = { border:true, borderColor:'808080', align:{h:'left', v:'center'} };
  const CELL_STYLE_CENTER = { border:true, borderColor:'808080', align:{h:'center', v:'center'} };
  const CELL_STYLE_LEFT_BOLD = { bold:true, border:true, borderColor:'808080', align:{h:'left', v:'center'} };
  const CELL_STYLE_CENTER_BOLD = { bold:true, border:true, borderColor:'808080', align:{h:'center', v:'center'} };
  const CELL_STYLE_PCT_OK = { border:true, borderColor:'808080', align:{h:'center', v:'center'}, fill:'FFE2EFDA', numFmt:'0.0%' };
  const CELL_STYLE_PCT_OK_BOLD = { bold:true, border:true, borderColor:'808080', align:{h:'center', v:'center'}, fill:'FFE2EFDA', numFmt:'0.0%' };
  const CELL_STYLE_PCT_PLAIN = { border:true, borderColor:'808080', align:{h:'center', v:'center'}, numFmt:'0.0%' };
  const CELL_STYLE_PCT_PLAIN_BOLD = { bold:true, border:true, borderColor:'808080', align:{h:'center', v:'center'}, numFmt:'0.0%' };
  const CELL_STYLE_PLAIN = { border:true, borderColor:'808080', align:{h:'center', v:'center'} };
  const CELL_STYLE_NUM2 = { border:true, borderColor:'808080', align:{h:'center', v:'center'}, numFmt:'0.00' };
  const CELL_STYLE_NUM2_BOLD = { bold:true, border:true, borderColor:'808080', align:{h:'center', v:'center'}, numFmt:'0.00' };
  const CELL_STYLE_FALHA_FILL = 'FFF8CBAD'; // vermelho/salmão claro — trecho com potencial de falha
  const CELL_STYLE_PLAIN_FALHA = { border:true, borderColor:'808080', align:{h:'center', v:'center'}, fill:CELL_STYLE_FALHA_FILL };
  const CELL_STYLE_PCT_FALHA = { border:true, borderColor:'808080', align:{h:'center', v:'center'}, fill:CELL_STYLE_FALHA_FILL, numFmt:'0.0%' };

  // ---- linha 1: cabeçalhos de grupo mesclados, igual ao original ----
  const groups = [
    {range:'A1:H1', label:'Descrição', c1:1},
    {range:'I1:K1', label:'Corrente de Fuga admissível (micro A)', c1:9},
    {range:'L1:M1', label:'Resistência de Isolação do trecho do circuito (MΩ)', c1:12},
    {range:'N1:O1', label:'Análise - Considerando valor de referência em relação a calculada', c1:14},
  ];
  groups.forEach(g=>{
    wb.mergeCells(g.range);
    wb.setCell(1, g.c1, g.label, HEADER_STYLE);
    // preenche o resto das células do merge com o mesmo estilo (visual consistente)
    const [, endRef] = g.range.split(':');
    const endCol = endRef.match(/[A-Z]+/)[0];
    for(let c=g.c1+1; c<=colNumberFromLetters(endCol); c++){
      wb.setCell(1, c, '', HEADER_STYLE);
    }
  });
  wb.setRowHeight(1, 28);

  // ---- linha 2: sub-cabeçalhos ----
  const subHeaders = ['Pista','Tipo','Circuito','Tensão (V)','Início do\ntrecho','Fim do\ntrecho',
    'Medida\naproximada\ndo trecho (m)','Número\nde trafos\n(Und.)','Cab','Trafos','Total',
    'Calculada','Medida','Situação do trecho','%'];
  subHeaders.forEach((h,i)=> wb.setCell(2, i+1, h, HEADER_STYLE));
  wb.setRowHeight(2, 42);

  // ---- linhas de dados ----
  let rowIdx = 3;
  function writeRow(inicio, fim, comprimento, trafos, medidaOverride, isResumo){
    const cabo_uA = (comprimento||0)/100;
    const trafos_uA = (trafos||0)*2;
    const total_uA = cabo_uA+trafos_uA;
    const calculada = total_uA>0 ? circ.tensao/total_uA : 0;
    // Linha de resumo (circuito inteiro): prioriza a medição real feita em
    // campo (se o técnico já mediu Se-NA→Se-NA no app); só usa o valor de
    // referência da planilha original enquanto isso ainda não foi medido.
    const fullRec = isResumo ? findFullCircuitRecord() : null;
    const rec = fullRec || (medidaOverride!==undefined ? null : findRecordFor(inicio, fim));
    const medida = fullRec ? fullRec.medida : (medidaOverride!==undefined ? medidaOverride : (rec ? rec.medida : null));
    const temMedida = medida!=null && medida!=='';
    const situacao = temMedida ? (medida>=calculada ? 'NORMAL' : 'TRECHO COM POTENCIAL DE FALHA') : '';
    const pct = temMedida && calculada>0 ? (medida/calculada) : null;
    const emFalha = situacao==='TRECHO COM POTENCIAL DE FALHA';

    const r = rowIdx;
    // Sem negrito na linha de resumo — mesmo estilo visual das demais linhas.
    const sLeft = CELL_STYLE_LEFT;
    const sCenter = CELL_STYLE_CENTER;
    const sPlain = emFalha ? CELL_STYLE_PLAIN_FALHA : CELL_STYLE_PLAIN;
    const sNum = CELL_STYLE_NUM2;

    wb.setCell(r, 1, circ.pistaLabel||currentPista, sLeft);
    wb.setCell(r, 2, circ.tipo, sLeft);
    wb.setCell(r, 3, circ.nome, sLeft);
    wb.setCell(r, 4, circ.tensao, sCenter);
    wb.setCell(r, 5, inicio, sCenter);
    wb.setCell(r, 6, fim, sCenter);
    wb.setCell(r, 7, comprimento??'', sCenter);
    wb.setCell(r, 8, trafos??'', sCenter);
    // colunas calculadas — fórmulas de verdade, iguais à planilha original,
    // pra ficar auditável em documento impresso (ordem de serviço).
    wb.setFormula(r, 9,  `G${r}/100`, Math.round(cabo_uA*100)/100, sNum);
    wb.setFormula(r, 10, `H${r}*2`, trafos_uA, sNum);
    wb.setFormula(r, 11, `I${r}+J${r}`, Math.round(total_uA*100)/100, sNum);
    wb.setFormula(r, 12, `IF(K${r}=0,0,D${r}/K${r})`, Math.round(calculada*100)/100, sNum);
    wb.setCell(r, 13, temMedida?medida:'', sPlain);
    wb.setFormula(r, 14, `IF(M${r}="","",IF(M${r}<L${r},"TRECHO COM POTENCIAL DE FALHA","NORMAL"))`, situacao, sPlain);
    // destaque verde quando normal, vermelho/salmão quando em potencial de falha
    const pctStyle = situacao==='NORMAL' ? CELL_STYLE_PCT_OK : (emFalha ? CELL_STYLE_PCT_FALHA : CELL_STYLE_PCT_PLAIN);
    wb.setFormula(r, 15, `IF(OR(M${r}="",L${r}=0),"",M${r}/L${r})`, pct!=null?Math.round(pct*1000)/1000:'', pctStyle);
    rowIdx++;
  }

  // total do circuito, se soubermos início/fim gerais
  if(circ.resumo && circ.pontos.length>1){
    writeRow(circ.pontos[0].label, circ.pontos[circ.pontos.length-1].label,
      circ.resumo.comprimento_total, circ.resumo.trafos_total, circ.resumo.medida_total, true);
  }

  // cada trecho oficial da planilha original
  (circ.trechos||[]).forEach(t=>{
    writeRow(t.inicio, t.fim, t.comprimento, t.trafos, undefined, false);
  });

  // setinhas de filtro no cabeçalho, igual ao original
  wb.setAutoFilter(`A2:O${rowIdx-1}`);

  const bytes = wb.toBytes();
  return new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function colNumberFromLetters(letters){
  let n = 0;
  for(let i=0;i<letters.length;i++){ n = n*26 + (letters.charCodeAt(i)-64); }
  return n;
}

// ---------------------------------------------------------------
// GERADOR DE .DOCX EMBUTIDO — relatório técnico em Word, com texto,
// tabela de medições, fotos e assinatura. Mesmo princípio do gerador
// de .xlsx: escreve o ZIP+XML na mão, sem depender de nada externo.
// (reaproveita xmlEscape já definido acima, junto do motor do xlsx)
// ---------------------------------------------------------------
function base64ToBytes(dataUrl) {
  const b64 = dataUrl.split(',')[1] || dataUrl;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
  return bytes;
}

// ------------------------------------------------------------------
// Construtor simples de .docx (Word) — parágrafos, tabela, imagens.
// ------------------------------------------------------------------
class SimpleDocx {
  constructor(){
    this.bodyXml = '';
    this.images = []; // {bytes, ext}
    this.figureCounter = 0; // numeração automática de "Figura NN", contínua no documento inteiro
  }

  nextFigureNum(){
    this.figureCounter++;
    return String(this.figureCounter).padStart(2,'0');
  }

  heading(text, level){
    const size = level===1 ? 32 : level===2 ? 26 : 22;
    this.bodyXml += `<w:p><w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr>` +
      `<w:r><w:rPr><w:b/><w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r></w:p>`;
  }

  paragraph(text, opts){
    opts = opts || {};
    const bold = opts.bold ? '<w:b/>' : '';
    const jc = opts.center ? '<w:jc w:val="center"/>' : '';
    this.bodyXml += `<w:p>${jc?`<w:pPr>${jc}</w:pPr>`:''}<w:r><w:rPr>${bold}</w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r></w:p>`;
  }

  // rowHighlights: array opcional de booleans (mesma quantidade de rows) —
  // true pinta a linha inteira com fundo vermelho claro (trecho/circuito
  // com pendência), pra bater o olho na tabela sem precisar de gráfico.
  table(headers, rows, rowHighlights){
    const colWidth = Math.floor(9000/headers.length);
    let xml = `<w:tbl><w:tblPr><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders>` +
      `<w:top w:val="single" w:sz="4" w:color="999999"/><w:left w:val="single" w:sz="4" w:color="999999"/>` +
      `<w:bottom w:val="single" w:sz="4" w:color="999999"/><w:right w:val="single" w:sz="4" w:color="999999"/>` +
      `<w:insideH w:val="single" w:sz="4" w:color="999999"/><w:insideV w:val="single" w:sz="4" w:color="999999"/>` +
      `</w:tblBorders></w:tblPr><w:tblGrid>` +
      headers.map(()=>`<w:gridCol w:w="${colWidth}"/>`).join('') + `</w:tblGrid>`;

    xml += `<w:tr>` + headers.map(h=>
      `<w:tc><w:tcPr><w:tcW w:w="${colWidth}" w:type="dxa"/><w:shd w:val="clear" w:fill="D9D9D9"/></w:tcPr>` +
      `<w:p><w:r><w:rPr><w:b/><w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">${xmlEscape(h)}</w:t></w:r></w:p></w:tc>`
    ).join('') + `</w:tr>`;

    rows.forEach((row, idx)=>{
      const highlight = rowHighlights && rowHighlights[idx];
      const shd = highlight ? `<w:shd w:val="clear" w:fill="F8CBAD"/>` : '';
      const bold = highlight ? '<w:b/>' : '';
      xml += `<w:tr>` + row.map(cell=>
        `<w:tc><w:tcPr><w:tcW w:w="${colWidth}" w:type="dxa"/>${shd}</w:tcPr>` +
        `<w:p><w:r><w:rPr>${bold}<w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">${xmlEscape(String(cell))}</w:t></w:r></w:p></w:tc>`
      ).join('') + `</w:tr>`;
    });
    xml += `</w:tbl><w:p/>`;
    this.bodyXml += xml;
  }

  _registerImage(dataUrl){
    const bytes = base64ToBytes(dataUrl);
    const idx = this.images.length + 1;
    this.images.push({bytes, ext:'jpeg'});
    return {idx, relId: `rIdImg${idx}`};
  }

  _drawingXml(relId, idx, widthEmu, heightEmu){
    return `<w:r><w:drawing>` +
      `<wp:inline distT="0" distB="0" distL="0" distR="0">` +
      `<wp:extent cx="${widthEmu}" cy="${heightEmu}"/>` +
      `<wp:docPr id="${idx}" name="Imagem${idx}"/>` +
      `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">` +
      `<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
      `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
      `<pic:nvPicPr><pic:cNvPr id="${idx}" name="Imagem${idx}"/><pic:cNvPicPr/></pic:nvPicPr>` +
      `<pic:blipFill><a:blip r:embed="${relId}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
      `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${widthEmu}" cy="${heightEmu}"/></a:xfrm>` +
      `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
      `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
  }

  _captionXml(caption){
    if(!caption) return '';
    const lines = Array.isArray(caption) ? caption : [caption];
    const runs = lines.map((line,i)=>
      (i>0?'<w:br/>':'') + `<w:t xml:space="preserve">${xmlEscape(line)}</w:t>`
    ).join('');
    return `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:i/><w:sz w:val="16"/><w:color w:val="666666"/></w:rPr>${runs}</w:r></w:p>`;
  }

  image(dataUrl, widthPx, heightPx, caption){
    const {idx, relId} = this._registerImage(dataUrl);
    const targetWEmu = 4114800; // ~4.5in
    const ratio = (heightPx&&widthPx) ? heightPx/widthPx : 0.75;
    const hEmu = Math.round(targetWEmu * ratio);
    this.bodyXml += `<w:p><w:pPr><w:jc w:val="center"/></w:pPr>${this._drawingXml(relId, idx, targetWEmu, hEmu)}</w:p>`;
    this.bodyXml += this._captionXml(caption);
    return relId;
  }

  // Foto e gráfico lado a lado, numa TABELA de 1 linha e 2 colunas, sem
  // borda visível, esticada até as margens da página (padrão ABNT) — cada
  // imagem com sua própria legenda "Figura NN" numerada automaticamente,
  // contínua ao longo de todo o relatório.
  imageTableRow(dataUrl1, w1, h1, label1, dataUrl2, w2, h2, label2){
    const img1 = this._registerImage(dataUrl1);
    const img2 = this._registerImage(dataUrl2);
    const tableWidthTwips = 9071; // largura útil da página com margens ABNT (3cm/2cm)
    const cellWidthTwips = Math.floor(tableWidthTwips/2);
    const cellPadTwips = 100;
    const imgWEmu = (cellWidthTwips - cellPadTwips*2) * 635;
    const h1Emu = Math.round(imgWEmu * ((h1&&w1)?h1/w1:0.75));
    const h2Emu = Math.round(imgWEmu * ((h2&&w2)?h2/w2:0.32));

    const fig1 = this.nextFigureNum();
    const fig2 = this.nextFigureNum();
    const cap1 = `Figura ${fig1}: ${label1}`;
    const cap2 = `Figura ${fig2}: ${label2}`;

    const noBorders = `<w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/></w:tcBorders>`;

    const cell = (imgObj, wEmu, hEmu, capText) =>
      `<w:tc><w:tcPr><w:tcW w:w="${cellWidthTwips}" w:type="dxa"/>${noBorders}` +
      `<w:tcMar><w:left w:w="${cellPadTwips}" w:type="dxa"/><w:right w:w="${cellPadTwips}" w:type="dxa"/></w:tcMar></w:tcPr>` +
      `<w:p><w:pPr><w:jc w:val="center"/></w:pPr>${this._drawingXml(imgObj.relId, imgObj.idx, wEmu, hEmu)}</w:p>` +
      `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:i/><w:sz w:val="16"/><w:color w:val="666666"/></w:rPr>` +
      `<w:t xml:space="preserve">${xmlEscape(capText)}</w:t></w:r></w:p></w:tc>`;

    this.bodyXml += `<w:tbl><w:tblPr><w:tblW w:w="${tableWidthTwips}" w:type="dxa"/>` +
      `<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/>` +
      `<w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>` +
      `<w:tblLayout w:type="fixed"/></w:tblPr>` +
      `<w:tblGrid><w:gridCol w:w="${cellWidthTwips}"/><w:gridCol w:w="${cellWidthTwips}"/></w:tblGrid>` +
      `<w:tr>${cell(img1, imgWEmu, h1Emu, cap1)}${cell(img2, imgWEmu, h2Emu, cap2)}</w:tr></w:tbl><w:p/>`;
  }

  toBytes(){
    const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Default Extension="jpeg" ContentType="image/jpeg"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '</Types>';

    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';

    const docRelsItems = this.images.map((img,i)=>
      `<Relationship Id="rIdImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i+1}.${img.ext}"/>`
    ).join('');
    const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + docRelsItems + '</Relationships>';

    const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">' +
      `<w:body>${this.bodyXml}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1701" w:right="1134" w:bottom="1134" w:left="1701"/></w:sectPr></w:body>` +
      '</w:document>';

    const files = [
      { name: '[Content_Types].xml', data: strToBytes(contentTypes) },
      { name: '_rels/.rels', data: strToBytes(rootRels) },
      { name: 'word/document.xml', data: strToBytes(documentXml) },
      { name: 'word/_rels/document.xml.rels', data: strToBytes(docRels) },
    ];
    this.images.forEach((img,i)=>{
      files.push({ name: `word/media/image${i+1}.${img.ext}`, data: img.bytes });
    });
    return buildZip(files);
  }
}

// Monta o relatório técnico (.docx) de um circuito: dados, tabela de
// medições, fotos anexadas (com legenda e coordenadas quando houver) e
// espaço pra conclusão/assinatura — mesma estrutura do modelo fornecido.
async function buildDocxForCircuit(circ){
  const recs = loadRecords().filter(r=>r.circId===circ.id && r.os===activeExportOS);
  const latestByKey = {};
  recs.forEach(r=>{
    const key = groupKeyFor(circ, r);
    if(!latestByKey[key] || r.ts>latestByKey[key].ts) latestByKey[key]=r;
  });
  const list = Object.values(latestByKey).sort((a,b)=>recordPosition(circ,a)-recordPosition(circ,b));
  if(list.length===0) return null;

  const doc = new SimpleDocx();
  const hoje = new Date().toLocaleDateString('pt-BR');

  doc.heading('RELATÓRIO TÉCNICO DE RESISTÊNCIA DE ISOLAÇÃO', 1);

  doc.heading('1. Dados do Circuito', 2);
  doc.paragraph(`Circuito: ${circLabel(circ)}`);
  doc.paragraph(`Local/Pista: ${currentPista}`);
  doc.paragraph(`Ordem de Serviço nº: ${activeExportOS}`);
  doc.paragraph(`Data da emissão: ${hoje}`);
  doc.paragraph(`Tensão do circuito: ${circ.tensao} V`);

  doc.heading('2. Tabela de Medições', 2);
  doc.table(
    ['Trecho (De - Até)','Comprimento (m)','Medida (MΩ)','Situação'],
    list.map(r=>[`${r.de} - ${r.ate}`, r.comprimento??'—', r.medida, r.situacao==='NORMAL'?'Normal':'Falha'])
  );

  const comFoto = list.filter(r=>r.foto);
  doc.heading('3. Registro Fotográfico', 2);
  if(comFoto.length===0){
    doc.paragraph('Nenhuma foto anexada às medições deste circuito.');
  } else {
    for(const r of comFoto){
      const d = new Date(r.ts).toLocaleString('pt-BR');
      let baseInfo = `Trecho: ${r.de} → ${r.ate}  ·  ${d}`;
      if(r.lat!=null && r.lng!=null){
        baseInfo += `  ·  📍 ${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}`;
      }
      // gera o mesmo gráfico de tendência que aparece no app pra esse
      // trecho, e coloca do lado da foto — se houver ao menos 1 medição.
      const trendRecs = getTrendHistory(circ, r.deIdx, r.ateIdx);
      let chartImg = null;
      if(trendRecs.length>0){
        const calc = computeRange(circ, r.deIdx, r.ateIdx);
        const calculada = calc ? calc.calculada : (r.calculada||0);
        try{
          chartImg = drawTrendChartToCanvas(trendRecs, calculada);
        }catch(e){ console.warn('Falha ao desenhar gráfico, seguindo só com a foto:', e); }
      }
      if(chartImg){
        // recorta a foto pro mesmo tamanho exato do gráfico (largura e
        // altura iguais, sem distorcer) antes de colocar os dois na tabela
        let fotoParaRelatorio = r.foto;
        try{
          const croppedDataUrl = await cropImageCover(r.foto.dataUrl, REPORT_IMG_W, REPORT_IMG_H);
          fotoParaRelatorio = {dataUrl: croppedDataUrl, width: REPORT_IMG_W, height: REPORT_IMG_H};
        }catch(e){ console.warn('Falha ao recortar foto pro tamanho padrão, usando original:', e); }
        doc.imageTableRow(
          fotoParaRelatorio.dataUrl, fotoParaRelatorio.width, fotoParaRelatorio.height, baseInfo,
          chartImg.dataUrl, chartImg.width, chartImg.height, `Gráfico de isolação ${baseInfo}`
        );
      } else {
        doc.image(r.foto.dataUrl, r.foto.width, r.foto.height, `Figura ${doc.nextFigureNum()}: ${baseInfo}`);
      }
    }
  }

  doc.heading('4. Conclusão Técnica', 2);
  const falhas = list.filter(r=>r.situacao==='FALHA');
  if(falhas.length>0){
    doc.paragraph(`${falhas.length} de ${list.length} trecho(s) medido(s) apresentaram valor abaixo do mínimo admissível, indicando potencial de falha de isolação. Recomenda-se ação corretiva nos trechos assinalados na tabela acima.`);
  } else {
    doc.paragraph(`Todos os ${list.length} trecho(s) medido(s) apresentaram valores dentro do padrão admissível.`);
  }
  doc.paragraph('');
  doc.paragraph('___________________________________________________________________');
  doc.paragraph('Assinatura: ________________________________');

  const bytes = doc.toBytes();
  return new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}


function buildCsvForCircuit(circ){
  const recs = loadRecords().filter(r=>r.circId===circ.id && r.os===activeExportOS);
  const latestByRange = {};
  recs.forEach(r=>{
    const key = groupKeyFor(circ, r);
    if(!latestByRange[key] || r.ts>latestByRange[key].ts) latestByRange[key]=r;
  });
  const list = Object.values(latestByRange).sort((a,b)=>recordPosition(circ,a)-recordPosition(circ,b));
  const header = ['Pista','Tipo','Circuito','Tensão (V)','Início do trecho','Fim do trecho',
    'Comprimento (m)','Nº trafos','Corrente admissível (µA)','Resistência calculada (MΩ)',
    'Medida (MΩ)','Situação','Manutenção','Data'];
  const lines = [header.join(';')];
  const fmt = v => (v==null || isNaN(v)) ? 'N/D' : v.toFixed(2);
  list.forEach(r=>{
    const d = new Date(r.ts).toLocaleString('pt-BR');
    lines.push([r.pista,r.tipo,r.circuito,r.tensao,r.de,r.ate,r.comprimento??'N/D',r.trafos??'N/D',
      fmt(r.total_uA),fmt(r.calculada),r.medida,r.situacao,
      r.manut==='corr'?'Corretiva':'Preventiva', d].map(csvEscape).join(';'));
  });
  return lines.join('\n');
}

function buildTextSummary(circ){
  const recs = loadRecords().filter(r=>r.circId===circ.id && r.os===activeExportOS);
  const latestByRange = {};
  recs.forEach(r=>{
    const key = groupKeyFor(circ, r);
    if(!latestByRange[key] || r.ts>latestByRange[key].ts) latestByRange[key]=r;
  });
  const list = Object.values(latestByRange).sort((a,b)=>recordPosition(circ,a)-recordPosition(circ,b));
  let txt = `*${circLabel(circ)}* — ${currentPista}\n`;
  txt += `Manutenção preventiva/corretiva — isolação\n\n`;
  list.forEach(r=>{
    const d = new Date(r.ts).toLocaleDateString('pt-BR');
    const manutLabel = r.manut==='corr'?'Corretiva':'Preventiva';
    txt += `${r.de} → ${r.ate}: medido ${r.medida} MΩ (mín. ${(r.calculada??0).toFixed(2)} MΩ) — ${r.situacao} [${manutLabel}, ${d}]\n`;
  });
  if(list.length===0) txt += 'Nenhum registro salvo ainda.';
  return txt;
}

async function exportCircuit(){
  const circ = currentCircuit;
  const recs = loadRecords().filter(r=>r.circId===circ.id && r.os===activeExportOS);
  if(recs.length===0){ showToast('Nenhum registro para exportar ainda.'); return; }
  const text = buildTextSummary(circ);
  const xlsxFilename = circLabel(circ).replace(/\s+/g,'_') + '.xlsx';

  // 1) MONTAGEM do arquivo .xlsx (só isso — sem compartilhar ainda). Se
  // quebrar aqui, é problema no gerador embutido, mostramos o erro fixo.
  let xlsxBlob = null;
  try{
    xlsxBlob = buildStyledXlsxForCircuit(circ);
  }catch(e){
    console.error('Falha ao MONTAR o xlsx:', e);
    showErrorPanel('Erro ao MONTAR a planilha (.xlsx):', (e && e.stack) || String(e));
  }

  // 2) Se montou certo, tenta compartilhar. Se compartilhar não der certo
  // por QUALQUER motivo (permissão negada, cancelado, indisponível...),
  // cai pro download direto do MESMO .xlsx já pronto — nunca degrada pra
  // CSV só porque o compartilhar falhou, já que o arquivo bom já existe.
  if(xlsxBlob){
    let compartilhado = false;
    try{
      const file = new File([xlsxBlob], xlsxFilename, {type: xlsxBlob.type});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: circ.nome, text: text});
        compartilhado = true;
      }
    }catch(e){
      if(e && e.name==='AbortError'){ return; } // usuário cancelou de propósito, sai quieto
      console.warn('Compartilhar falhou, tentando baixar direto:', e);
    }
    if(compartilhado) return;

    try{
      const url = URL.createObjectURL(xlsxBlob);
      const a = document.createElement('a');
      a.href = url; a.download = xlsxFilename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(()=>{}); }
      showToast('Planilha (.xlsx) baixada e resumo copiado.');
      return;
    }catch(e){
      console.error('Falha ao BAIXAR o xlsx:', e);
      showErrorPanel('Erro ao COMPARTILHAR/BAIXAR a planilha (.xlsx):', (e && e.stack) || String(e));
    }
  }

  // 3) Reserva: CSV, sempre por download direto (nunca tenta compartilhar
  // aqui, pra não abrir uma caixinha que tampe o aviso de erro acima).
  try{
    const csv = buildCsvForCircuit(circ);
    const filename = circLabel(circ).replace(/\s+/g,'_') + '.csv';
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(()=>{}); }
    showToast('CSV baixado (veja o aviso vermelho acima com o motivo).', 4000);
  }catch(err){
    console.error('Erro ao exportar:', err);
    showErrorPanel('Erro inesperado ao exportar:', (err && err.stack) || String(err));
  }
}

async function exportDocxCircuit(){
  const circ = currentCircuit;
  const recs = loadRecords().filter(r=>r.circId===circ.id && r.os===activeExportOS);
  if(recs.length===0){ showToast('Nenhum registro para gerar relatório ainda.'); return; }

  let docxBlob = null;

      await navigator.share({files:[file], title: circLabel(circ)+' — Relatório'});
      compartilhado = true;

  }catch(e){
    if(e && e.name==='AbortError'){ return; }
    console.warn('Compartilhar falhou, tentando baixar direto:', e);

  if(compartilhado) return;

  try{
    const url = URL.createObjectURL(docxBlob);

  }
}

// ---------------------------------------------------------------
// TOAST
// ---------------------------------------------------------------
let toastTimer;
function showToast(msg, durationMs){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), durationMs || 2600);
}

// Painel de erro que NÃO some sozinho (o toast normal pode ficar escondido
// atrás da caixinha de compartilhamento do celular, que abre por cima da
// tela — esse painel fica visível até o usuário fechar de propósito).
function showErrorPanel(title, details){
  const panel = document.getElementById('errPanel');
  const body = document.getElementById('errPanelBody');
  body.textContent = (title ? title + '\n\n' : '') + details;
  panel.style.display = 'block';
}
document.getElementById('errPanelClose').onclick = ()=>{
  document.getElementById('errPanel').style.display = 'none';
};

// ---------------------------------------------------------------
// INIT
// ---------------------------------------------------------------
function render(){
  renderTabs();
  renderList();
}
render();
